<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- النافبار الكبسولي -->
  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-links">
        <a href="index.html#hero">الرئيسية</a>
        <a href="index.html#courses">الكورسات المتاحة</a>
        <a href="index.html#honorRoll">لوحة الشرف</a>
        <a href="support.html">الدعم الفني</a>
      </div>
      <div class="capsule-auth" id="navAuthBox">
        <a href="register.html" class="nav-btn-primary">إنشاء حساب جديد</a>
      </div>
    </nav>
  </div>

  <div class="auth-page-wrapper">
    <div class="auth-card anim-fade-up">
      <div style="text-align:center; margin-bottom: 28px;">
        <div class="capsule-logo" style="margin: 0 auto 12px; width:46px; height:46px; font-size:17px;">HK</div>
        <h1 style="font-size: 25px; font-weight: 900; color: var(--royal-indigo-base);">تسجيل الدخول للمنصة</h1>
        <p style="color: var(--text-muted); font-size: 13.5px; margin-top: 4px;">منظومة الكيمياء للأستاذ محمد السعيد</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>البريد الإلكتروني:</label>
          <input type="email" id="logEmail" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label>كلمة المرور:</label>
          <input type="password" id="logPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:12px; font-size:14.5px;">تسجيل الدخول</button>
      </form>

      <div style="text-align:center; margin-top: 22px; font-size: 13.5px; color: var(--text-muted);">
        ليس لديك حساب؟ <a href="register.html" style="color:var(--cyan-accent); font-weight:800; text-decoration:none;">إنشاء حساب طالب جديد</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      var email = document.getElementById("logEmail").value.trim().toLowerCase();
      var password = document.getElementById("logPassword").value;

      var users = JSON.parse(localStorage.getItem("edu_users")) || [];
      var user = users.find(function(u) {
        return u.email.toLowerCase() === email && u.password === password;
      });

      if (user) {
        localStorage.setItem("current_user", JSON.stringify(user));
        showToast("مرحباً بك مجدداً يا " + user.fullName, "success");

        setTimeout(function() {
          if (user.role === "SUPER_ADMIN" || user.role === "ADMIN") {
            window.location.href = "admin.html";
          } else if (user.role === "SUPPORT") {
            window.location.href = "support.html";
          } else {
            var urlParams = new URLSearchParams(window.location.search);
            var redirect = urlParams.get("redirect");
            window.location.href = redirect ? decodeURIComponent(redirect) : "dashboard.html";
          }
        }, 1000);
      } else {
        showToast("البريد الإلكتروني أو كلمة المرور غير صحيحة", "error");
      }
    });
  </script>
</body>
</html>
