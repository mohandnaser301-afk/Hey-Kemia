<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تسجيل الدخول - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page-wrapper {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 16px 30px;
    }
    .auth-card-modern {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
    }
    .verification-alert-box {
      display: none;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 13px;
      color: #92400E;
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth">
        <a href="register.html" class="nav-btn-primary">حساب جديد</a>
      </div>
    </nav>
  </div>

  <div class="auth-page-wrapper">
    <div class="auth-card-modern">
      <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-size: 20px; font-weight: 900; color: var(--royal-indigo-base); margin-bottom: 4px;">تسجيل الدخول</h1>
        <p style="color: var(--text-muted); font-size: 13px;">منصة الكيمياء للأستاذ محمد السعيد</p>
      </div>

      <!-- تنبيه التحقق من البريد الإلكتروني -->
      <div class="verification-alert-box" id="verificationAlertBox">
        <strong style="display:block; margin-bottom:4px;">يرجى تأكيد بريدك الإلكتروني أولاً</strong>
        <p style="margin-bottom:8px; line-height:1.4;">تم إرسال رابط التفعيل إلى بريدك. يرجى مراجعة صندوق الوارد (أو Spam) والضغط على الرابط ثم إعادة الدخول.</p>
        <button type="button" class="btn btn-outline" style="padding:4px 12px; font-size:11.5px; width:100%;" onclick="handleResendVerification()">إعادة إرسال رابط التفعيل</button>
      </div>

      <form id="loginMainForm">
        <div class="form-group">
          <label>البريد الإلكتروني:</label>
          <input type="email" id="loginEmailInput" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label>كلمة المرور:</label>
          <input type="password" id="loginPasswordInput" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:14px; margin-top:8px;">دخول للمنصة ←</button>
      </form>

      <div style="text-align:center; margin-top: 18px; font-size: 13px; color: var(--text-muted);">
        ليس لديك حساب؟ <a href="register.html" style="color:var(--cyan-accent); font-weight:800; text-decoration:none;">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("loginMainForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      var email = document.getElementById("loginEmailInput").value.trim();
      var password = document.getElementById("loginPasswordInput").value;
      var alertBox = document.getElementById("verificationAlertBox");
      alertBox.style.display = "none";

      showToast("جاري التحقق من الحساب...", "info");

      try {
        var user = await window.FirebaseService.loginUser(email, password);
        showToast("تم تسجيل الدخول بنجاح", "success");
        setTimeout(function() {
          if (user.role === "SUPER_ADMIN" || user.role === "ADMIN") {
            window.location.replace("admin.html");
          } else if (user.role === "SUPPORT") {
            window.location.replace("support.html");
          } else {
            window.location.replace("dashboard.html");
          }
        }, 800);
      } catch (err) {
        if (err.message === "EMAIL_NOT_VERIFIED") {
          alertBox.style.display = "block";
          showToast("يرجى تأكيد بريدك الإلكتروني لتتمكن من الدخول", "error");
        } else {
          showToast(err.message || "فشل تسجيل الدخول", "error");
        }
      }
    });

    async function handleResendVerification() {
      var email = document.getElementById("loginEmailInput").value.trim();
      var password = document.getElementById("loginPasswordInput").value;
      if (!email || !password) {
        showToast("يرجى إدخال البريد وكلمة المرور لإعادة الإرسال", "error");
        return;
      }
      try {
        await window.FirebaseService.resendVerificationEmail(email, password);
        showToast("تم إرسال رابط تفعيل جديد إلى بريدك الإلكتروني", "success");
      } catch (e) {
        showToast("حدث خطأ أثناء الإرسال: " + e.message, "error");
      }
    }
  </script>
</body>
</html>
