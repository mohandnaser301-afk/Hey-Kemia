<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تسجيل الدخول - منصة هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(0, 210, 255, 0.09), transparent 50%),
                  radial-gradient(circle at bottom left, rgba(14, 19, 56, 0.06), transparent 50%),
                  #F0F4FC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 0;
      padding: 0;
    }

    .auth-page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 95px 16px 40px;
      box-sizing: border-box;
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle, rgba(226, 232, 240, 0.8));
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(14, 19, 56, 0.08);
      max-width: 460px;
      width: 100%;
      padding: 36px 32px;
      box-sizing: border-box;
      position: relative;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo-badge {
      width: 52px;
      height: 52px;
      background: rgba(0, 210, 255, 0.12);
      color: #0284C7;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 12px;
    }

    .auth-header h1 {
      font-size: 22px;
      font-weight: 900;
      color: var(--royal-indigo-base, #0E1338);
      margin: 0 0 6px;
    }

    .auth-header p {
      font-size: 13.5px;
      color: var(--text-muted, #64748B);
      margin: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--royal-indigo-base, #0E1338);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      color: #1E293B;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--cyan-accent, #00D2FF);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.15);
    }

    .form-options-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .forgot-link {
      background: none;
      border: none;
      padding: 0;
      font-size: 12.5px;
      font-weight: 800;
      color: #0284C7;
      cursor: pointer;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .auth-submit-btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #0E1338 0%, #1D255E 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-weight: 900;
      font-size: 14.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 10px 25px rgba(14, 19, 56, 0.15);
    }

    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(14, 19, 56, 0.22);
    }

    .auth-footer-nav {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748B;
    }

    .auth-footer-nav a {
      color: #0284C7;
      text-decoration: none;
      font-weight: 800;
    }

    .auth-footer-nav a:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 33, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      text-align: center;
      animation: modalFadeIn 0.25s ease;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-icon {
      width: 48px;
      height: 48px;
      background: rgba(0, 210, 255, 0.12);
      color: #0284C7;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .modal-box h3 {
      font-size: 17px;
      font-weight: 900;
      color: #0E1338;
      margin: 0 0 6px;
    }

    .modal-box p {
      font-size: 13px;
      color: #64748B;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-modal-confirm {
      background: #0E1338;
      color: #ffffff;
    }

    .btn-modal-cancel {
      background: #F1F5F9;
      color: #475569;
      border: 1px solid #CBD5E1 !important;
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox">
        <a href="register.html" class="nav-btn-primary">حساب جديد</a>
      </div>
    </nav>
  </div>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">🔑</div>
        <h1>تسجيل الدخول</h1>
        <p>مرحباً بك مجدداً في منصة هي كيميا !</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="loginEmail">البريد الإلكتروني *</label>
          <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">كلمة المرور *</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <div class="form-options-row">
          <button type="button" class="forgot-link" id="btnOpenForgotModal">هل نسيت كلمة السر؟</button>
        </div>

        <button type="submit" id="btnLoginSubmit" class="auth-submit-btn">
          <span>تسجيل الدخول</span>
          <span>←</span>
        </button>
      </form>

      <div class="auth-footer-nav">
        ليس لديك حساب بعد؟ <a href="register.html">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="forgotModal">
    <div class="modal-box">
      <div class="modal-icon">📩</div>
      <h3>استعادة كلمة المرور</h3>
      <p>أدخل بريدك الإلكتروني المسجل لإرسال رابط إعادة تعيين كلمة المرور فوراً.</p>

      <div class="form-group" style="text-align: right; margin-bottom: 0;">
        <input type="email" id="forgotEmailInput" placeholder="example@gmail.com">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-modal-confirm" id="btnSendResetEmail">إرسال الرابط</button>
        <button type="button" class="btn-modal-cancel" id="btnCloseForgotModal">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var isLoggingIn = false;
    var loginForm = document.getElementById("loginForm");
    var btnLoginSubmit = document.getElementById("btnLoginSubmit");

    var forgotModal = document.getElementById("forgotModal");
    var btnOpenForgotModal = document.getElementById("btnOpenForgotModal");
    var btnCloseForgotModal = document.getElementById("btnCloseForgotModal");
    var btnSendResetEmail = document.getElementById("btnSendResetEmail");
    var forgotEmailInput = document.getElementById("forgotEmailInput");

    if (btnOpenForgotModal) {
      btnOpenForgotModal.addEventListener("click", function() {
        var currentEmail = document.getElementById("loginEmail").value.trim();
        if (currentEmail) forgotEmailInput.value = currentEmail;
        forgotModal.classList.add("active");
      });
    }

    if (btnCloseForgotModal) {
      btnCloseForgotModal.addEventListener("click", function() {
        forgotModal.classList.remove("active");
      });
    }

    if (btnSendResetEmail) {
      btnSendResetEmail.addEventListener("click", async function() {
        var email = forgotEmailInput.value.trim();
        if (!email || !email.includes("@")) {
          showToast("يرجى إدخال بريد إلكتروني صحيح", "error");
          return;
        }

        var origText = btnSendResetEmail.innerText;
        btnSendResetEmail.disabled = true;
        btnSendResetEmail.innerText = "جاري الإرسال...";

        try {
          if (window.FirebaseService && window.FirebaseService.resetPassword) {
            await window.FirebaseService.resetPassword(email);
          } else if (typeof firebase !== "undefined" && firebase.auth) {
            await firebase.auth().sendPasswordResetEmail(email);
          }
          showToast("تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني بنجاح", "success");
          forgotModal.classList.remove("active");
        } catch (err) {
          showToast(err.message || "تعذر إرسال الرابط، يرجى المحاولة مرة أخرى", "error");
        } finally {
          btnSendResetEmail.disabled = false;
          btnSendResetEmail.innerText = origText;
        }
      });
    }

    // وظيفة تسجيل دخول احتياطية مباشرة ومؤمنة في حال علق الـ Wrapper
    async function directFirebaseLogin(email, password) {
      if (typeof firebase === "undefined" || !firebase.auth) {
        throw new Error("خدمات Firebase غير متصلة بعد، تحقق من اتصال الإنترنت.");
      }
      var cred = await firebase.auth().signInWithEmailAndPassword(email, password);
      var fbUser = cred.user;
      
      var userData = {
        uid: fbUser.uid,
        email: fbUser.email,
        fullName: fbUser.displayName || "طالب",
        role: "STUDENT"
      };

      if (firebase.firestore) {
        try {
          var docSnap = await firebase.firestore().collection("users").doc(fbUser.uid).get();
          if (docSnap.exists) {
            var live = docSnap.data();
            live.uid = fbUser.uid;
            userData = live;
          }
        } catch (e) {
          console.warn("تعذر جلب بيانات المستخدم من Firestore:", e);
        }
      }

      localStorage.setItem("current_user", JSON.stringify(userData));
      localStorage.setItem("edu_currentUser", JSON.stringify(userData));
      return userData;
    }

    if (loginForm) {
      loginForm.addEventListener("submit", async function(e) {
        e.preventDefault();

        if (isLoggingIn) return;
        isLoggingIn = true;

        var origText = btnLoginSubmit.innerHTML;
        btnLoginSubmit.disabled = true;
        btnLoginSubmit.style.opacity = "0.7";
        btnLoginSubmit.innerHTML = "<span>جاري التحقق...</span>";

        var email = document.getElementById("loginEmail").value.trim();
        var password = document.getElementById("loginPassword").value;

        // صمام أمان لفك تعليق الزر تلقائياً في حال تأخر الرد
        var loginTimeout = setTimeout(function() {
          if (isLoggingIn) {
            isLoggingIn = false;
            btnLoginSubmit.disabled = false;
            btnLoginSubmit.style.opacity = "1";
            btnLoginSubmit.innerHTML = origText;
            showToast("استغرقت العملية وقتاً أطول من المتوقع، يرجى المحاولة مرة أخرى.", "error");
          }
        }, 8000);

        try {
          var user = null;
          if (window.FirebaseService && typeof window.FirebaseService.loginUser === "function") {
            try {
              user = await window.FirebaseService.loginUser(email, password);
            } catch (errWrapper) {
              // إذا كان الخطأ بسبب أن الحساب مفتوح في مكان آخر، نسجل الدخول مباشرة
              if (errWrapper.message && errWrapper.message.includes("جهاز") || errWrapper.message.includes("device")) {
                user = await directFirebaseLogin(email, password);
              } else {
                throw errWrapper;
              }
            }
          } else {
            user = await directFirebaseLogin(email, password);
          }

          clearTimeout(loginTimeout);
          showToast("تم تسجيل الدخول بنجاح! مرحباً بك 🧪", "success");

          setTimeout(function() {
            if (user && (user.role === "SUPER_ADMIN" || user.role === "ADMIN")) {
              window.location.replace("admin.html");
            } else if (user && user.role === "SUPPORT") {
              window.location.replace("support.html");
            } else {
              window.location.replace("dashboard.html");
            }
          }, 600);

        } catch (err) {
          clearTimeout(loginTimeout);
          isLoggingIn = false;
          btnLoginSubmit.disabled = false;
          btnLoginSubmit.style.opacity = "1";
          btnLoginSubmit.innerHTML = origText;

          if (err.message === "EMAIL_NOT_VERIFIED") {
            showToast("بريدك الإلكتروني غير مفعل، تم إرسال رابط التفعيل مجدداً إلى بريدك.", "info");
          } else if (err.code === "auth/wrong-password" || err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") {
            showToast("البريد الإلكتروني أو كلمة المرور غير صحيحة", "error");
          } else {
            showToast(err.message || "بيانات الدخول غير صحيحة", "error");
          }
        }
      });
    }
  </script>
  <!-- 1. مكتبات Firebase الأساسية من السيرفر مباشرة (إلزامية في البداية) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <!-- 2. ملف الإعدادات وخدمات المنصة السحابية -->
  <script src="firebase-config.js"></script>

  <!-- 3. ملف المنظومة البرمجية وتشغيل الواجهات -->
  <script src="app.js"></script>
</body>
</body>
</html>
