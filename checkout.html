<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هي كيميا ! - تأكيد الاشتراك والدفع</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .payment-box { max-width: 520px; margin: 40px auto; }
    .payment-instructions { background: #F8F9FC; border: 1.5px dashed var(--chem-gold); padding: 16px; border-radius: 12px; margin: 20px 0; }
  </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <a href="index.html#courses" class="nav-btn-link">إلغاء</a>
    </nav>
  </div>

  <div class="container" style="flex: 1; display: flex; align-items: center;">
    <div class="form-container payment-box">
      <h2 style="color: var(--royal-indigo-base); font-size: 22px; font-weight: 900; text-align: center; margin-bottom: 4px;">إتمام الاشتراك والدفع</h2>
      <p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 20px;">حول المبلغ عبر فودافون كاش أو فوري لتفعيل كورس أ/ محمد السعيد</p>

      <div style="background: #F8F9FC; border: 1px solid var(--border-subtle); padding: 14px; border-radius: 10px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <span style="color: var(--text-muted);">الكورس:</span>
          <strong id="courseTitle" style="color: var(--royal-indigo-base);">جاري التحميل...</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--text-muted);">المبلغ المطلوب:</span>
          <strong id="coursePrice" style="color: var(--chem-gold); font-size: 16px;">---</strong>
        </div>
      </div>

      <div class="payment-instructions">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span>فودافون كاش:</span>
          <strong style="color:var(--chem-gold);">01012345678</strong>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span>كود خدمة فوري:</span>
          <strong style="color:var(--chem-gold);">987654</strong>
        </div>
      </div>

      <form id="paymentForm">
        <div class="form-group">
          <label>طريقة التحويل:</label>
          <select id="paymentMethod" required>
            <option value="vodafone">فودافون كاش</option>
            <option value="fawry">فوري</option>
          </select>
        </div>

        <div class="form-group">
          <label>صورة إيصال التحويل:</label>
          <input type="file" id="receiptFile" accept="image/*" required>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; padding: 12px; margin-top: 10px;">إرسال الإيصال وتأكيد الاشتراك</button>
      </form>
    </div>
  </div>

  <footer class="platform-footer" style="margin-top:auto;">
    <div class="container">
      <div class="footer-bottom-bar" style="border-top:none; padding-top:0;">
        <p>© 2026 جميع الحقوق محفوظة لمنصة <strong>هي كيميا !</strong> - أ/ محمد السعيد</p>
        <p>الدعم الفني وتأكيد الدفع: <strong style="color:var(--chem-gold);">01012345678</strong></p>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    var user = getCurrentUser();
    if (!user) window.location.href = "login.html";

    var urlParams = new URLSearchParams(window.location.search);
    var courseId = urlParams.get("course") || "c1";

    // إذا كان الطالب مشتركاً بالفعل في هذا الكورس يتم منعه من الدفع وتحويله للمحاضرات
    if (user && user.enrolledCourses && user.enrolledCourses.includes(courseId)) {
      showToast("أنت مشترك بالفعل في هذا الكورس!", "success");
      setTimeout(function() {
        window.location.replace("course-view.html?id=" + courseId);
      }, 1000);
    }

    var courses = JSON.parse(localStorage.getItem("edu_courses")) || [];
    var course = courses.find(function(c) { return c.id == courseId; });

    if (course) {
      document.getElementById("courseTitle").innerText = course.title;
      document.getElementById("coursePrice").innerText = course.price + " ج.م";
    }

    document.getElementById("paymentForm").addEventListener("submit", function(e) {
      e.preventDefault();
      var file = document.getElementById("receiptFile").files[0];
      var reader = new FileReader();
      reader.onload = function(event) {
        var payments = JSON.parse(localStorage.getItem("edu_payments")) || [];
        payments.push({
          id: Date.now(),
          userEmail: user.email,
          userName: user.fullName,
          studentPhone: user.studentPhone || "01000000000",
          courseId: courseId,
          courseTitle: course ? course.title : "كورس كيمياء",
          amount: course ? course.price : 220,
          method: document.getElementById("paymentMethod").value,
          receipt: event.target.result,
          status: "PENDING"
        });
        localStorage.setItem("edu_payments", JSON.stringify(payments));
        logAdminAction("إرسال طلب دفع", "قام الطالب " + user.fullName + " برفع إيصال دفع.");
        showToast("تم إرسال الإيصال بنجاح، جاري مراجعته وتفعيل الكورس", "success");
        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 1200);
      };
      if (file) reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
