<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هي كيميا ! - تأكيد الاشتراك والدفع</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .payment-box { max-width: 520px; margin: 40px auto; }
    .payment-instructions { background: rgba(15, 23, 42, 0.8); border: 1px dashed rgba(16, 185, 129, 0.3); padding: 16px; border-radius: 12px; margin: 20px 0; }
  </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <header class="navbar">
    <div class="container nav-container">
      <div class="logo"><h2>هي كيميا<span>!</span></h2></div>
      <a href="index.html#courses" class="btn btn-outline">إلغاء ✕</a>
    </div>
  </header>

  <div class="container" style="flex: 1; display: flex; align-items: center;">
    <div class="form-container payment-box">
      <h2 style="color: #fff; font-size: 22px; text-align: center; margin-bottom: 4px;">إتمام الاشتراك والدفع</h2>
      <p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 20px;">حول المبلغ عبر فودافون كاش أو فوري وارفع صورة الإيصال</p>

      <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 14px; border-radius: 10px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <span style="color: var(--text-muted);">الكورس:</span>
          <strong id="courseTitle" style="color: #fff;">جاري التحميل...</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--text-muted);">المبلغ المطلوب:</span>
          <strong id="coursePrice" style="color: var(--emerald-light); font-size: 16px;">---</strong>
        </div>
      </div>

      <div class="payment-instructions">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span>📱 فودافون كاش:</span>
          <strong style="color:var(--emerald-light);">01012345678</strong>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span>🏢 كود خدمة فوري:</span>
          <strong style="color:var(--emerald-light);">987654</strong>
        </div>
      </div>

      <form id="paymentForm">
        <div class="form-group">
          <label>طريقة التحويل:</label>
          <select id="paymentMethod" required>
            <option value="vodafone">فودافون كاش</option>
            <option value="fawry">فوري</option>
          </select>
        </div>

        <div class="form-group">
          <label>صورة إيصال التحويل:</label>
          <input type="file" id="receiptFile" accept="image/*" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">إرسال الإيصال وتأكيد الاشتراك 🚀</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem("current_user"));
    if (!user) window.location.href = "login.html";

    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get("course") || "c1";
    const courses = JSON.parse(localStorage.getItem("edu_courses")) || [];
    const course = courses.find(c => c.id == courseId);

    if (course) {
      document.getElementById("courseTitle").innerText = course.title;
      document.getElementById("coursePrice").innerText = `${course.price} ج.م`;
    }

    document.getElementById("paymentForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const file = document.getElementById("receiptFile").files[0];
      const reader = new FileReader();
      reader.onload = function (event) {
        const payments = JSON.parse(localStorage.getItem("edu_payments")) || [];
        payments.push({
          id: Date.now(),
          userEmail: user.email,
          userName: user.fullName,
          studentPhone: user.studentPhone || "01000000000",
          courseId: courseId,
          courseTitle: course ? course.title : "كورس كيمياء",
          amount: course ? course.price : 220,
          method: document.getElementById("paymentMethod").value,
          receipt: event.target.result,
          status: "PENDING"
        });
        localStorage.setItem("edu_payments", JSON.stringify(payments));
        alert("✅ تم إرسال الإيصال بنجاح! سيتم تفعيله من قبل الإدارة فوراً.");
        window.location.href = "dashboard.html";
      };
      if (file) reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
