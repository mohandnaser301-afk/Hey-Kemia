<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تأكيد الاشتراك والدفع - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .checkout-page-wrapper {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 85px 16px 30px;
    }
    .checkout-card-modern {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 28px 22px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
    }
    .payment-instruction-box {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      border-radius: 12px;
      padding: 14px;
      margin: 16px 0;
      font-size: 13px;
      color: #166534;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox"></div>
    </nav>
  </div>

  <div class="checkout-page-wrapper">
    <div class="checkout-card-modern">
      <div style="text-align: center; margin-bottom: 16px;">
        <h1 style="font-size: 19px; font-weight: 900; color: var(--royal-indigo-base); margin-bottom: 4px;">تأكيد الاشتراك والتحويل</h1>
        <p style="color: var(--text-muted); font-size: 12.5px;" id="checkoutCourseTitleDisplay">جاري جلب تفاصيل الكورس...</p>
      </div>

      <div class="payment-instruction-box">
        <strong>طريقة الدفع (فودافون كاش / إنستاباي):</strong><br>
        1. قم بتحويل مبلغ <strong id="checkoutPriceDisplay" style="color:#059669; font-size:15px;">250 ج.م</strong> إلى الرقم: <strong style="direction:ltr; display:inline-block; font-size:14px;">01012345678</strong><br>
        2. التقط صورة واضحة لإشعار أو إيصال التحويل.<br>
        3. ارفع الصورة هنا لتفعيل الكورس فور مراجعته.
      </div>

      <form id="checkoutSubmitForm">
        <div class="form-group">
          <label>اسم الطالب:</label>
          <input type="text" id="chkStudentName" readonly style="background:#F8FAFC;">
        </div>

        <div class="form-group">
          <label>رقم هاتف الطالب (واتساب):</label>
          <input type="text" id="chkStudentPhone" readonly style="background:#F8FAFC;">
        </div>

        <div class="form-group">
          <label>صورة إيصال التحويل:</label>
          <input type="file" id="chkReceiptFile" accept="image/*" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:10px;">إرسال طلب التفعيل للأدمن ✓</button>
      </form>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var selectedCourse = null;
    var currentUser = null;

    document.addEventListener("DOMContentLoaded", function() {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = "login.html?redirect=" + encodeURIComponent(window.location.href);
        return;
      }

      var urlParams = new URLSearchParams(window.location.search);
      var courseId = urlParams.get("course");
      var courses = JSON.parse(localStorage.getItem("edu_courses")) || [];
      selectedCourse = courses.find(c => c.id == courseId);

      if (!selectedCourse) {
        showToast("الكورس غير موجود", "error");
        setTimeout(() => window.location.href = "index.html#courses", 1000);
        return;
      }

      document.getElementById("checkoutCourseTitleDisplay").innerText = selectedCourse.title;
      document.getElementById("checkoutPriceDisplay").innerText = selectedCourse.price + " ج.م";
      document.getElementById("chkStudentName").value = currentUser.fullName;
      document.getElementById("chkStudentPhone").value = currentUser.studentPhone;
    });

    document.getElementById("checkoutSubmitForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      var fileInput = document.getElementById("chkReceiptFile");
      if (!fileInput.files || !fileInput.files[0]) {
        return showToast("يرجى إرفاق صورة الإيصال", "error");
      }

      var file = fileInput.files[0];
      var reader = new FileReader();

      showToast("جاري إرسال الطلب سحابياً...", "info");

      reader.onload = async function(event) {
        try {
          var compressedReceipt = await compressImageBase64(event.target.result, 400, 400, 0.4);

          var paymentData = {
            userId: currentUser.uid,
            userName: currentUser.fullName,
            userEmail: currentUser.email.toLowerCase().trim(),
            studentPhone: currentUser.studentPhone,
            courseId: selectedCourse.id,
            courseTitle: selectedCourse.title,
            amount: selectedCourse.price,
            receipt: compressedReceipt
          };

          await window.FirebaseService.submitPayment(paymentData);
          showToast("تم إرسال طلب الدفع بنجاح وسيتم تفعيل الكورس فور المراجعة", "success");
          setTimeout(() => window.location.href = "dashboard.html", 1200);
        } catch (err) {
          showToast("فشل إرسال الطلب: " + err.message, "error");
        }
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
