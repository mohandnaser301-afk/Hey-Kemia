<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تأكيد الاشتراك والدفع - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .checkout-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 95px 16px 40px;
    }
    .checkout-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0,0,0,0.06);
    }
    .vodafone-box {
      background: #FFF5F5;
      border: 1.5px dashed #EF4444;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin: 16px 0 20px;
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth">
        <a href="dashboard.html" class="nav-btn-primary">لوحة التحكم</a>
      </div>
    </nav>
  </div>

  <div class="checkout-wrapper">
    <div class="checkout-card">
      <h2 style="font-size:20px; font-weight:900; color:var(--royal-indigo-base); margin-bottom:6px;">تأكيد الاشتراك وإرسال الإيصال</h2>
      <p style="color:var(--text-muted); font-size:13px; margin-bottom:18px;">تحويل رسوم الاشتراك عبر فودافون كاش وتفعيل الكورس فوراً</p>

      <div style="background:#F8FAFC; border:1px solid #E2E8F0; padding:14px; border-radius:12px; margin-bottom:15px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="font-size:13px; color:var(--text-muted);">الكورس المختار:</span>
          <strong id="checkoutCourseTitle" style="color:var(--royal-indigo-base);">-</strong>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="font-size:13px; color:var(--text-muted);">المبلغ المطلوب:</span>
          <strong id="checkoutCoursePrice" style="color:#059669; font-size:16px;">- ج.م</strong>
        </div>
      </div>

      <div class="vodafone-box">
        <span style="font-size:12px; color:#EF4444; font-weight:800;">رقم التحويل (فودافون كاش):</span>
        <h3 style="font-size:20px; font-weight:900; color:#1E293B; letter-spacing:1px; margin:4px 0;">01012345678</h3>
        <small style="color:#64748B; font-size:11.5px;">* يرجى إرسال المبلغ ثم إرفاق صورة واضحة من رسالة التحويل أدناه.</small>
      </div>

      <form id="checkoutPaymentForm">
        <input type="hidden" id="checkoutCourseId">
        <div class="form-group">
          <label>رقم الهاتف الذي قمت بالتحويل منه:</label>
          <input type="tel" id="checkoutSenderPhone" placeholder="01xxxxxxxxx" maxlength="11" required oninput="this.value=this.value.replace(/\D/g,'')">
        </div>

        <div class="form-group">
          <label>إرفاق صورة إيصال التحويل:</label>
          <input type="file" id="checkoutReceiptFile" accept="image/*" required onchange="handleReceiptUpload(event)">
          <input type="hidden" id="checkoutReceiptBase64">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:14px; margin-top:8px;">إرسال طلب التفعيل الآن ←</button>
      </form>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentSelectedCourse = null;

    function handleReceiptUpload(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = async function(e) {
        var base64 = e.target.result;
        var compressed = window.compressImageBase64 ? await window.compressImageBase64(base64, 400, 400, 0.4) : base64;
        document.getElementById("checkoutReceiptBase64").value = compressed;
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener("DOMContentLoaded", function() {
      var user = getCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      var urlParams = new URLSearchParams(window.location.search);
      var courseId = urlParams.get("course");
      var courses = JSON.parse(localStorage.getItem("edu_courses")) || [];
      currentSelectedCourse = courses.find(c => c.id == courseId);

      if (!currentSelectedCourse) {
        showToast("لم يتم العثور على الكورس المطلوب", "error");
        setTimeout(function() { window.location.href = "index.html#courses"; }, 1000);
        return;
      }

      document.getElementById("checkoutCourseId").value = currentSelectedCourse.id;
      document.getElementById("checkoutCourseTitle").innerText = currentSelectedCourse.title;
      document.getElementById("checkoutCoursePrice").innerText = currentSelectedCourse.price + " ج.م";
    });

    document.getElementById("checkoutPaymentForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      var user = getCurrentUser();
      var senderPhone = document.getElementById("checkoutSenderPhone").value.trim();
      var receiptImg = document.getElementById("checkoutReceiptBase64").value;

      if (!senderPhone || senderPhone.length < 11) {
        showToast("يرجى إدخال رقم الهاتف المحول منه بشكل صحيح (11 رقماً)", "error");
        return;
      }

      if (!receiptImg) {
        showToast("يرجى اختيار صورة واضحة لإيصال التحويل", "error");
        return;
      }

      showToast("جاري إرسال طلب الدفع سحابياً للإدارة...", "info");

      try {
        var paymentData = {
          userEmail: user.email.toLowerCase(),
          userName: user.fullName,
          studentPhone: senderPhone,
          courseId: currentSelectedCourse.id,
          courseTitle: currentSelectedCourse.title,
          amount: currentSelectedCourse.price,
          receipt: receiptImg
        };

        if (window.FirebaseService) {
          await window.FirebaseService.submitPayment(paymentData);
        }

        showToast("تم إرسال إيصال التحويل بنجاح! سيتم التفعيل فور مراجعته.", "success");
        setTimeout(function() { window.location.href = "dashboard.html"; }, 1500);
      } catch (err) {
        showToast("تعذر إرسال الإيصال: " + err.message, "error");
      }
    });
  </script>
</body>
</html>
