<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هي كيميا ! - مشاهدة المحاضرات</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .course-player-layout { display: grid; grid-template-columns: 1fr 340px; gap: 25px; max-width: 1300px; margin: 25px auto; padding: 0 20px; }
    .video-wrapper { background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid var(--border); }
    .video-wrapper iframe { width: 100%; height: 100%; border: none; }
    .playlist-card { background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border); padding: 20px; backdrop-filter: blur(15px); }
    .playlist-item { padding: 12px; background: rgba(4, 9, 13, 0.7); border-radius: 8px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; }
    .playlist-item.active { border: 1px solid var(--emerald); background: rgba(16, 185, 129, 0.1); }
    .views-badge { background: rgba(6, 182, 212, 0.15); border: 1px solid var(--cyan); color: var(--cyan); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .blocked-screen { display: none; text-align: center; padding: 60px 20px; background: var(--bg-card); border: 1px solid #ef4444; border-radius: 18px; max-width: 600px; margin: 60px auto; }
    @media (max-width: 900px) { .course-player-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <div class="logo"><h2>هي كيميا<span>!</span></h2></div>
      <div style="display:flex; align-items:center; gap:15px;">
        <span class="views-badge" id="viewsDisplay">👁️ جاري التحقق من السحابة...</span>
        <a href="dashboard.html" class="btn btn-outline">لوحة التحكم ↩</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="blocked-screen" id="blockedScreen">
      <div style="font-size: 50px; margin-bottom: 15px;">🛑</div>
      <h2 style="color: #ef4444; margin-bottom: 10px;">عذراً، لقد استنفدت عدد مرات الدخول المسموحة!</h2>
      <p style="color: var(--text-muted); margin-bottom: 25px;">لقد بلغت الحد الأقصى لمشاهدة هذا الكورس. يرجى مراجعة المعلم أو الدعم الفني.</p>
      <a href="dashboard.html" class="btn btn-primary">العودة للوحة التحكم</a>
    </div>
  </div>

  <div class="course-player-layout" id="playerLayout">
    <main>
      <div class="video-wrapper">
        <iframe id="mainPlayer" src="" allowfullscreen></iframe>
      </div>
      <div style="margin-top: 20px;">
        <h2 id="currentLessonTitle" style="color:#fff; font-size:22px;">جاري تحميل المحاضرة...</h2>
        <p id="courseDesc" style="color:var(--text-muted); margin-top:8px; font-size:14px;"></p>
      </div>
    </main>

    <aside class="playlist-card">
      <h3 style="color:#fff; margin-bottom:15px; font-size:16px;">فهرس المحاضرات</h3>
      <div id="lessonsList"></div>
    </aside>
  </div>

  <script type="module">
    import { db, doc, getDoc, updateDoc, getCurrentUser } from "./app.js";

    const user = getCurrentUser();
    if (!user) window.location.href = "login.html";

    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get("id");

    async function loadCourseCloud() {
      const courseSnap = await getDoc(doc(db, "courses", courseId));
      if (!courseSnap.exists()) {
        alert("الكورس غير متاح!");
        window.location.href = "dashboard.html";
        return;
      }

      const course = courseSnap.data();
      const maxAllowed = Number(course.maxViews) || 5;

      // جلب استهلاك المستخدم من السحابة
      const userSnap = await getDoc(doc(db, "users", user.uid));
      let accessCount = {};
      if (userSnap.exists() && userSnap.data().courseAccessCount) {
        accessCount = userSnap.data().courseAccessCount;
      }

      let currentViews = (accessCount[courseId] || 0) + 1;
      accessCount[courseId] = currentViews;
      await updateDoc(doc(db, "users", user.uid), { courseAccessCount: accessCount });

      if (currentViews > maxAllowed) {
        document.getElementById("playerLayout").style.display = "none";
        document.getElementById("blockedScreen").style.display = "block";
      } else {
        document.getElementById("viewsDisplay").innerText = `👁️ الدخول (${currentViews} من ${maxAllowed}) | المتبقي: ${maxAllowed - currentViews}`;
      }

      document.getElementById("courseDesc").innerText = course.desc || "";
      const lessons = course.lessons || [];

      document.getElementById("lessonsList").innerHTML = lessons.map((l, idx) => `
        <div class="playlist-item ${idx === 0 ? 'active' : ''}" onclick="playLesson('${l.videoUrl}', '${l.title}', this)">
          <div><h4 style="font-size:13px; color:#fff;">${idx + 1}. ${l.title}</h4><span style="font-size:11px; color:var(--text-muted);">⏱️ ${l.duration}</span></div>
        </div>
      `).join('');

      if (lessons.length > 0) {
        document.getElementById("mainPlayer").src = lessons[0].videoUrl;
        document.getElementById("currentLessonTitle").innerText = lessons[0].title;
      }
    }

    window.playLesson = (url, title, el) => {
      document.getElementById("mainPlayer").src = url;
      document.getElementById("currentLessonTitle").innerText = title;
      document.querySelectorAll(".playlist-item").forEach(item => item.classList.remove("active"));
      el.classList.add("active");
    };

    loadCourseCloud();
  </script>
</body>
</html>
