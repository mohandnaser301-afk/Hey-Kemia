<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هي كيميا ! - مشاهدة المحاضرات</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .course-player-layout { display: grid; grid-template-columns: 1fr 340px; gap: 25px; max-width: 1220px; margin: 25px auto; padding: 0 20px; }
    .video-wrapper { background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid var(--border-subtle); }
    .video-wrapper iframe { width: 100%; height: 100%; border: none; }
    .playlist-card { background: #fff; border-radius: 14px; border: 1px solid var(--border-subtle); padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .playlist-item { padding: 12px; background: #F8FAFC; border-radius: 8px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; }
    .playlist-item.active { border: 1.5px solid var(--chem-gold); background: rgba(197, 136, 56, 0.08); }
    .views-badge { background: rgba(197, 136, 56, 0.1); border: 1px solid var(--chem-gold); color: var(--chem-gold); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .blocked-screen { display: none; text-align: center; padding: 60px 20px; background: #fff; border: 1px solid #EF4444; border-radius: 18px; max-width: 600px; margin: 60px auto; }
    @media (max-width: 900px) { .course-player-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div style="display:flex; align-items:center; gap:15px;">
        <span class="views-badge" id="viewsDisplay">👁️ المتبقي لك: --</span>
        <a href="dashboard.html" class="nav-btn-link">لوحة التحكم ↩</a>
      </div>
    </nav>
  </div>

  <div class="container">
    <div class="blocked-screen" id="blockedScreen">
      <div style="font-size: 50px; margin-bottom: 15px;">🛑</div>
      <h2 style="color: #EF4444; margin-bottom: 10px;">عذراً، لقد استنفدت عدد مرات الدخول المسموحة!</h2>
      <p style="color: var(--text-muted); margin-bottom: 25px;">لقد بلغت الحد الأقصى لمشاهدة هذا الكورس. يرجى مراجعة المعلم أو الدعم الفني.</p>
      <a href="dashboard.html" class="btn btn-primary">العودة للوحة التحكم</a>
    </div>
  </div>

  <div class="course-player-layout" id="playerLayout">
    <main>
      <div class="video-wrapper">
        <iframe id="mainPlayer" src="" allowfullscreen></iframe>
      </div>
      <div style="margin-top: 20px;">
        <h2 id="currentLessonTitle" style="color:var(--primary-navy); font-size:22px; font-weight:900;">جاري تحميل المحاضرة...</h2>
        <p id="courseDesc" style="color:var(--text-muted); margin-top:8px; font-size:14px;"></p>
      </div>
    </main>

    <aside class="playlist-card">
      <h3 style="color:var(--primary-navy); margin-bottom:15px; font-size:16px; font-weight:800;">فهرس المحاضرات</h3>
      <div id="lessonsList"></div>
      <div style="margin-top: 25px; border-top: 1px solid var(--border-subtle); padding-top: 15px;">
        <a id="examLink" href="#" class="btn btn-primary" style="width: 100%; display: block; text-align: center;">📝 دخول امتحان الكورس</a>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
  <script>
    var user = getCurrentUser();
    if (!user) window.location.href = "login.html";

    var urlParams = new URLSearchParams(window.location.search);
    var courseId = urlParams.get("id") || "c1";
    var courses = JSON.parse(localStorage.getItem("edu_courses")) || [];
    var course = courses.find(function(c) { return c.id == courseId; });

    if (!course) { alert("الكورس غير متاح!"); window.location.href = "dashboard.html"; }

    var maxAllowed = Number(course.maxViews) || 5;
    var users = JSON.parse(localStorage.getItem("edu_users")) || [];
    var uIdx = users.findIndex(function(u) { return u.email === user.email; });

    if (uIdx !== -1) {
      if (!users[uIdx].courseAccessCount) users[uIdx].courseAccessCount = {};
      var currentViews = (users[uIdx].courseAccessCount[courseId] || 0) + 1;
      users[uIdx].courseAccessCount[courseId] = currentViews;
      localStorage.setItem("edu_users", JSON.stringify(users));

      if (currentViews > maxAllowed) {
        document.getElementById("playerLayout").style.display = "none";
        document.getElementById("blockedScreen").style.display = "block";
      } else {
        document.getElementById("viewsDisplay").innerText = "👁️ الدخول (" + currentViews + " من " + maxAllowed + ") | المتبقي: " + (maxAllowed - currentViews);
      }
    }

    document.getElementById("courseDesc").innerText = course.desc;
    document.getElementById("examLink").href = "exam.html?examId=" + (course.examId || 'e1');

    var lessons = course.lessons || [];
    document.getElementById("lessonsList").innerHTML = lessons.map(function(l, idx) {
      return '<div class="playlist-item ' + (idx === 0 ? 'active' : '') + '" onclick="playLesson(\'' + l.videoUrl + '\', \'' + l.title + '\', this)">' +
        '<div><h4 style="font-size:13px; color:var(--primary-navy); font-weight:800;">' + (idx + 1) + '. ' + l.title + '</h4><span style="font-size:11px; color:var(--text-muted);">⏱️ ' + l.duration + '</span></div>' +
      '</div>';
    }).join('');

    if (lessons.length > 0) {
      document.getElementById("mainPlayer").src = lessons[0].videoUrl;
      document.getElementById("currentLessonTitle").innerText = lessons[0].title;
    }

    function playLesson(url, title, el) {
      document.getElementById("mainPlayer").src = url;
      document.getElementById("currentLessonTitle").innerText = title;
      document.querySelectorAll(".playlist-item").forEach(function(item) { item.classList.remove("active"); });
      el.classList.add("active");
    }
  </script>
</body>
</html>
