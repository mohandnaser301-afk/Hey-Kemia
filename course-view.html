<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مشاهدة المحاضرة - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
    }
    .course-view-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      padding: 85px 16px 40px;
      max-width: 1240px;
      margin: 0 auto;
    }
    .video-secure-container {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      padding-top: 56.25%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }
    .video-secure-container iframe,
    .video-secure-container #mainCourseVideoIframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: auto;
    }
    /* طبقة عزل علوية تمنع النقر على عنوان يوتيوب وزر المشاركة */
    .video-top-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      z-index: 12;
      background: transparent;
      pointer-events: auto;
    }
    /* طبقة عزل سفلية تحجب زر نسخ الرابط، وشعار يوتيوب، والمزيد من الفيديوهات */
    .video-bottom-shield {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      z-index: 12;
      background: transparent;
      pointer-events: none;
    }
    /* حجب الزوايا التفاعلية في شريط التحكم لمنع نسخ الرابط والضغط على يوتيوب */
    .video-bottom-right-blocker {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 110px;
      height: 48px;
      z-index: 14;
      background: transparent;
      pointer-events: auto;
    }
    .video-bottom-left-blocker {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 180px;
      height: 48px;
      z-index: 14;
      background: transparent;
      pointer-events: auto;
    }
    /* زر مخصص لتكبير الشاشة مع الحفاظ على الواتر مارك */
    .custom-fs-btn {
      position: absolute;
      bottom: 8px;
      left: 12px;
      z-index: 20;
      background: rgba(14, 19, 56, 0.85);
      color: #00D2FF;
      border: 1px solid rgba(0, 210, 255, 0.4);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }
    .custom-fs-btn:hover {
      background: #00D2FF;
      color: #0E1338;
    }
    .secure-watermark {
      position: absolute;
      color: rgba(255, 255, 255, 0.35);
      font-size: 13.5px;
      font-weight: 800;
      pointer-events: none;
      z-index: 25;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(2px);
      animation: floatWatermark 18s linear infinite alternate;
    }
    @keyframes floatWatermark {
      0% { top: 12%; left: 10%; }
      25% { top: 70%; left: 15%; }
      50% { top: 22%; left: 65%; }
      75% { top: 68%; left: 60%; }
      100% { top: 16%; left: 12%; }
    }
    .lessons-sidebar-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      padding: 18px;
      height: fit-content;
      max-height: 80vh;
      overflow-y: auto;
    }
    .lesson-playlist-item {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .lesson-playlist-item.active {
      background: rgba(0,210,255,0.12);
      border-color: var(--cyan-accent);
    }
    .pdf-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #F1F5F9;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--royal-indigo-base);
      text-decoration: none;
    }
    /* ضمان ملء الشاشة للحاوية بكافة محتوياتها */
    .video-secure-container:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      padding-top: 0 !important;
      border-radius: 0 !important;
    }
    .video-secure-container:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      padding-top: 0 !important;
      border-radius: 0 !important;
    }
    @media (max-width: 900px) {
      .course-view-layout { grid-template-columns: 1fr; padding-top: 75px; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="courseNavAuthBox">
        <a href="dashboard.html" class="nav-btn-primary" id="navRoleDirectLink">لوحة الطالب</a>
      </div>
    </nav>
  </div>

  <div class="course-view-layout">
    <div>
      <div class="video-secure-container" id="videoContainerWrapper">
        <div class="video-top-shield"></div>
        <div class="video-bottom-shield"></div>
        <div class="video-bottom-right-blocker" title="منصة هي كيميا"></div>
        <div class="video-bottom-left-blocker"></div>
        <button type="button" class="custom-fs-btn" onclick="toggleSecureFullscreen()">⛶ شاشة كاملة</button>
        <div class="secure-watermark" id="videoDynamicWatermark">HE-KEMIA SECURE</div>
        <div id="ytPlayerTarget"></div>
      </div>

      <div style="background:#fff; border-radius:16px; padding:20px; border:1px solid var(--border-subtle); margin-top:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h2 id="currentLessonTitleDisplay" style="font-size:18px; font-weight:900; color:var(--royal-indigo-base); margin:0;">عنوان المحاضرة</h2>
          <span style="background:rgba(16,185,129,0.12); color:#059669; font-weight:800; font-size:11.5px; padding:3px 10px; border-radius:12px;">مشاهدة مصرحة ✓</span>
        </div>
        <p id="courseMainTitleSub" style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">اسم الكورس</p>
        <div id="lessonPdfsContainer" style="margin-top:12px; border-top:1px solid #EEF2F6; padding-top:12px;"></div>
      </div>
    </div>

    <div class="lessons-sidebar-card">
      <h3 style="font-size:15px; font-weight:900; color:var(--royal-indigo-base); margin-bottom:14px;">محاضرات الكورس</h3>
      <div id="lessonsPlaylistContainer"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    var currentCourse = null;
    var currentLessonIdx = 0;
    var ytPlayer = null;
    var isYtApiReady = false;
    var watchTimerInterval = null;
    var isVideoActivelyPlaying = false;
    var currentUserId = null;
    var currentCourseId = null;

    document.addEventListener("keydown", function(e) {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67))) {
        e.preventDefault();
        return false;
      }
    });

    // ملء الشاشة للحاوية بكاملها لضمان بقاء الواتر مارك والطبقات العازلة
    function toggleSecureFullscreen() {
      var container = document.getElementById("videoContainerWrapper");
      if (!container) return;

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) {
          container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }
    window.toggleSecureFullscreen = toggleSecureFullscreen;

    function extractYouTubeVideoId(url) {
      if (!url) return "";
      var clean = String(url).trim();
      var id = "";
      if (clean.indexOf("youtu.be/") !== -1) {
        id = clean.split("youtu.be/")[1].split("?")[0].split("&")[0];
      } else if (clean.indexOf("watch?v=") !== -1) {
        var params = new URLSearchParams(clean.split("?")[1] || "");
        id = params.get("v") || "";
      } else if (clean.indexOf("embed/") !== -1) {
        id = clean.split("embed/")[1].split("?")[0].split("&")[0];
      } else if (clean.indexOf("shorts/") !== -1) {
        id = clean.split("shorts/")[1].split("?")[0].split("&")[0];
      } else {
        id = clean;
      }
      return id;
    }

    function onYouTubeIframeAPIReady() {
      isYtApiReady = true;
      if (currentCourse && currentCourse.lessons && currentCourse.lessons[currentLessonIdx]) {
        mountYouTubePlayer(currentLessonIdx);
      }
    }

    function mountYouTubePlayer(idx) {
      if (!currentCourse || !currentCourse.lessons || !currentCourse.lessons[idx]) return;
      var lesson = currentCourse.lessons[idx];
      var rawVideoId = extractYouTubeVideoId(lesson.videoUrl);
      var savedProgressSec = getSavedLessonProgress(currentCourseId, idx);

      if (ytPlayer && typeof ytPlayer.loadVideoById === "function") {
        ytPlayer.loadVideoById({
          videoId: rawVideoId,
          startSeconds: savedProgressSec
        });
      } else {
        ytPlayer = new YT.Player('ytPlayerTarget', {
          videoId: rawVideoId,
          host: 'https://www.youtube-nocookie.com',
          playerVars: {
            autoplay: 0,
            controls: 1,
            modestbranding: 1,
            rel: 0,
            fs: 0, // إخفاء زر التكبير الافتراضي ليوتيوب واستخدام الزر المحمي المخصص
            iv_load_policy: 3,
            disablekb: 0,
            playsinline: 1,
            origin: window.location.origin,
            start: savedProgressSec
          },
          events: {
            'onReady': function(event) {
              if (savedProgressSec > 0) {
                event.target.seekTo(savedProgressSec, true);
              }
            },
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isVideoActivelyPlaying = true;
      } else {
        isVideoActivelyPlaying = false;
        saveCurrentProgressSnapshot();
      }
    }

    function getSavedLessonProgress(courseId, lessonIdx) {
      try {
        var progressMap = JSON.parse(localStorage.getItem("edu_lesson_resume_points")) || {};
        var key = (currentUserId || "usr") + "_" + courseId + "_l" + lessonIdx;
        return Number(progressMap[key]) || 0;
      } catch (e) {
        return 0;
      }
    }

    function saveCurrentProgressSnapshot() {
      if (!ytPlayer || typeof ytPlayer.getCurrentTime !== "function") return;
      try {
        var currentTime = Math.floor(ytPlayer.getCurrentTime());
        if (currentTime > 0) {
          var progressMap = JSON.parse(localStorage.getItem("edu_lesson_resume_points")) || {};
          var key = (currentUserId || "usr") + "_" + currentCourseId + "_l" + currentLessonIdx;
          progressMap[key] = currentTime;
          localStorage.setItem("edu_lesson_resume_points", JSON.stringify(progressMap));

          if (window.firebase && firebase.firestore && currentUserId) {
            var updateObj = {};
            updateObj["progress_" + currentCourseId + "_l" + currentLessonIdx] = currentTime;
            firebase.firestore().collection("users").doc(currentUserId).set(updateObj, { merge: true }).catch(function(){});
          }
        }
      } catch (e) {}
    }

    function playLesson(idx) {
      if (!currentCourse || !currentCourse.lessons || !currentCourse.lessons[idx]) return;
      
      saveCurrentProgressSnapshot();
      currentLessonIdx = idx;
      var lesson = currentCourse.lessons[idx];

      document.getElementById("currentLessonTitleDisplay").innerText = lesson.title;

      var pdfsContainer = document.getElementById("lessonPdfsContainer");
      var pdfsList = Array.isArray(lesson.pdfs) ? lesson.pdfs : [];
      if (pdfsList.length === 0 && lesson.pdfUrl) {
        pdfsList.push({ name: "مذكرة المحاضرة", url: lesson.pdfUrl });
      }

      if (pdfsList.length > 0) {
        pdfsContainer.innerHTML = '<strong style="font-size:12.5px; color:#475569; display:block; margin-bottom:6px;">المذكرات والملفات المرفقة:</strong><div style="display:flex; gap:8px; flex-wrap:wrap;">' +
          pdfsList.map(p => '<a href="' + p.url + '" target="_blank" class="pdf-download-btn">📄 ' + p.name + '</a>').join("") +
          '</div>';
      } else {
        pdfsContainer.innerHTML = '<span style="font-size:12px; color:var(--text-muted);">لا توجد ملفات مرفقة مع هذه المحاضرة.</span>';
      }

      document.querySelectorAll(".lesson-playlist-item").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });

      if (isYtApiReady) {
        mountYouTubePlayer(idx);
      }
    }

    function startAccurateWatchTracking(userUid, courseId) {
      if (watchTimerInterval) clearInterval(watchTimerInterval);

      watchTimerInterval = setInterval(function() {
        if (!isVideoActivelyPlaying) return;

        var tracking = JSON.parse(localStorage.getItem("edu_course_watch_logs")) || {};
        if (!tracking[courseId]) tracking[courseId] = {};
        if (!tracking[courseId][userUid]) {
          tracking[courseId][userUid] = { totalSeconds: 0, lastActive: new Date().toLocaleTimeString("ar-EG") };
        }

        tracking[courseId][userUid].totalSeconds += 3;
        tracking[courseId][userUid].lastActive = new Date().toLocaleTimeString("ar-EG");
        localStorage.setItem("edu_course_watch_logs", JSON.stringify(tracking));

        saveCurrentProgressSnapshot();

        if (window.firebase && firebase.firestore) {
          firebase.firestore().collection("course_watch_logs").doc(courseId + "_" + userUid).set({
            courseId: courseId,
            userUid: userUid,
            totalSeconds: tracking[courseId][userUid].totalSeconds,
            lastActive: tracking[courseId][userUid].lastActive,
            updatedAt: new Date().toISOString()
          }, { merge: true }).catch(function(){});
        }
      }, 3000);
    }

    document.addEventListener("DOMContentLoaded", function() {
      var user = getCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUserId = user.uid || user.id;

      // ضبط زر النافبار العلوي وفقاً للرتبة الحقيقية
      var role = String(user.role || "STUDENT").toUpperCase();
      var isAdmin = role === "ADMIN" || role === "SUPER_ADMIN" || role === "SUPERADMIN" || role === "MANAGER";
      var isSupport = role === "SUPPORT";
      var navLink = document.getElementById("navRoleDirectLink");
      if (navLink) {
        if (isAdmin) {
          navLink.href = "admin.html";
          navLink.innerText = "لوحة الإدارة";
        } else if (isSupport) {
          navLink.href = "support.html";
          navLink.innerText = "شات الدعم";
        } else {
          navLink.href = "dashboard.html";
          navLink.innerText = "لوحة الطالب";
        }
      }

      var wm = document.getElementById("videoDynamicWatermark");
      if (wm) wm.innerText = user.fullName + " | " + (user.studentPhone || user.phone || "");

      var urlParams = new URLSearchParams(window.location.search);
      currentCourseId = urlParams.get("id");
      var courses = JSON.parse(localStorage.getItem("edu_courses")) || [];
      currentCourse = courses.find(c => String(c.id) === String(currentCourseId));

      if (!currentCourse) {
        showToast("لم يتم العثور على الكورس", "error");
        setTimeout(() => window.location.href = "dashboard.html", 1000);
        return;
      }

      var isStaff = isAdmin || isSupport;
      var isEnrolled = isStudentEnrolledInCourse(user, currentCourseId);

      if (!isStaff && !isEnrolled) {
        showToast("غير مصرح لك بمشاهدة هذا الكورس، يرجى الاشتراك أولاً", "error");
        setTimeout(() => window.location.href = "dashboard.html", 1200);
        return;
      }

      document.getElementById("courseMainTitleSub").innerText = currentCourse.title;

      var container = document.getElementById("lessonsPlaylistContainer");
      var lessons = currentCourse.lessons || [];

      if (lessons.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">لا توجد محاضرات منشورة بعد.</p>';
      } else {
        container.innerHTML = lessons.map((l, i) => 
          '<div class="lesson-playlist-item" onclick="playLesson(' + i + ')">' +
            '<div>' +
              '<h4 style="font-size:13px; font-weight:800; color:var(--royal-indigo-base); margin-bottom:2px;">' + (i + 1) + '. ' + l.title + '</h4>' +
              '<span style="font-size:11px; color:var(--text-muted);">⏱️ ' + (l.duration || "45 دقيقة") + '</span>' +
            '</div>' +
            '<span>▶</span>' +
          '</div>'
        ).join("");

        playLesson(0);
        startAccurateWatchTracking(currentUserId, currentCourseId);
      }
    });

    window.addEventListener("beforeunload", function() {
      saveCurrentProgressSnapshot();
      if (watchTimerInterval) clearInterval(watchTimerInterval);
    });
  </script>
</body>
</html>
