<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مشاهدة المحاضرة - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .course-view-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      padding: 95px 16px 40px;
      max-width: 1240px;
      margin: 0 auto;
    }
    .video-player-box {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      padding-top: 56.25%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    }
    .video-player-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .lessons-sidebar-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      padding: 18px;
      height: fit-content;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .lesson-playlist-item {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .lesson-playlist-item.active {
      background: rgba(0,210,255,0.12);
      border-color: var(--cyan-accent);
    }
    .pdf-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #F1F5F9;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--royal-indigo-base);
      text-decoration: none;
      margin-top: 6px;
    }
    @media (max-width: 900px) {
      .course-view-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth">
        <a href="dashboard.html" class="nav-btn-primary">لوحة التحكم</a>
      </div>
    </nav>
  </div>

  <div class="course-view-layout">
    <div>
      <div class="video-player-box">
        <iframe id="mainCourseVideoIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <div style="background:#fff; border-radius:16px; padding:20px; border:1px solid var(--border-subtle); margin-top:16px;">
        <h2 id="currentLessonTitleDisplay" style="font-size:18px; font-weight:900; color:var(--royal-indigo-base); margin-bottom:8px;">عنوان المحاضرة</h2>
        <p id="courseMainTitleSub" style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">اسم الكورس</p>
        <div id="lessonPdfsContainer"></div>
      </div>
    </div>

    <div class="lessons-sidebar-card">
      <h3 style="font-size:15px; font-weight:900; color:var(--royal-indigo-base); margin-bottom:14px;">محاضرات الكورس:</h3>
      <div id="lessonsPlaylistContainer"></div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentCourse = null;
    var currentLessonIdx = 0;

    function playLesson(idx) {
      if (!currentCourse || !currentCourse.lessons || !currentCourse.lessons[idx]) return;
      currentLessonIdx = idx;
      var lesson = currentCourse.lessons[idx];

      // تحويل الرابط لصيغة Embed صالحة للتشغيل الفوري
      var validEmbedUrl = formatYouTubeEmbedUrl(lesson.videoUrl);
      document.getElementById("mainCourseVideoIframe").src = validEmbedUrl;
      document.getElementById("currentLessonTitleDisplay").innerText = lesson.title;

      var pdfsContainer = document.getElementById("lessonPdfsContainer");
      if (lesson.pdfs && lesson.pdfs.length > 0) {
        pdfsContainer.innerHTML = '<strong style="font-size:12.5px; color:#475569;">المذكرات وملفات الـ PDF المرفقة:</strong><div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">' +
          lesson.pdfs.map(p => '<a href="' + p.url + '" target="_blank" class="pdf-download-btn">📄 ' + p.name + '</a>').join("") +
          '</div>';
      } else {
        pdfsContainer.innerHTML = "";
      }

      document.querySelectorAll(".lesson-playlist-item").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });
    }

    document.addEventListener("DOMContentLoaded", function() {
      var user = getCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      var urlParams = new URLSearchParams(window.location.search);
      var courseId = urlParams.get("id");
      var courses = JSON.parse(localStorage.getItem("edu_courses")) || [];
      currentCourse = courses.find(c => c.id == courseId);

      if (!currentCourse) {
        showToast("لم يتم العثور على الكورس", "error");
        setTimeout(() => window.location.href = "dashboard.html", 1000);
        return;
      }

      document.getElementById("courseMainTitleSub").innerText = currentCourse.title;

      var container = document.getElementById("lessonsPlaylistContainer");
      var lessons = currentCourse.lessons || [];

      if (lessons.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">لا توجد محاضرات منشورة بعد.</p>';
      } else {
        container.innerHTML = lessons.map((l, i) => 
          '<div class="lesson-playlist-item" onclick="playLesson(' + i + ')">' +
            '<div>' +
              '<h4 style="font-size:13px; font-weight:800; color:var(--royal-indigo-base); margin-bottom:2px;">' + (i + 1) + '. ' + l.title + '</h4>' +
              '<span style="font-size:11px; color:var(--text-muted);">⏱️ ' + (l.duration || "45 دقيقة") + '</span>' +
            '</div>' +
            '<span>▶</span>' +
          '</div>'
        ).join("");

        playLesson(0);
      }
    });
  </script>
</body>
</html>
