<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هي كيميا ! - منصة الاختبارات التفاعلية</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .exam-wrapper { max-width: 780px; margin: 40px auto; }
    .question-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 22px; margin-bottom: 20px; }
    .opt-label { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .opt-label:hover { border-color: var(--emerald); background: rgba(16, 185, 129, 0.08); }
    .timer-badge { background: rgba(244, 63, 94, 0.15); border: 1px solid #f43f5e; color: #f43f5e; padding: 6px 14px; border-radius: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <div class="logo"><h2>هي كيميا<span>!</span></h2></div>
      <div style="display:flex; align-items:center; gap:15px;">
        <span class="timer-badge" id="timer">⏱️ 15:00</span>
        <a href="dashboard.html" class="btn btn-outline">إلغاء ✕</a>
      </div>
    </div>
  </header>

  <div class="container exam-wrapper">
    <div style="margin-bottom:25px; text-align:center;">
      <h1 id="examTitle" style="color:#fff; font-size:24px; margin-bottom:6px;">امتحان الكيمياء</h1>
      <p style="color:var(--text-muted); font-size:14px;">أجب عن جميع الأسئلة بدقة للحصول على تقييمك</p>
    </div>

    <form id="examForm">
      <div id="questionsContainer"></div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-size:16px;">تسليم الإجابات وإنهاء الامتحان 🚀</button>
    </form>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem("current_user"));
    if (!user) window.location.href = "login.html";

    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get("examId") || "e1";
    const exams = JSON.parse(localStorage.getItem("edu_exams")) || [];
    const exam = exams.find(e => e.id == examId) || exams[0];

    document.getElementById("examTitle").innerText = exam.title;

    const questions = exam.questions || [];
    document.getElementById("questionsContainer").innerHTML = questions.map((q, qIdx) => `
      <div class="question-card">
        <h3 style="color:#fff; font-size:16px; margin-bottom:15px;">${qIdx + 1}. ${q.q}</h3>
        <div>
          ${q.options.map((opt, oIdx) => `
            <label class="opt-label">
              <input type="radio" name="q_${qIdx}" value="${oIdx}" required>
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `).join('');

    document.getElementById("examForm").addEventListener("submit", (e) => {
      e.preventDefault();
      let score = 0;
      questions.forEach((q, qIdx) => {
        const selected = document.querySelector(`input[name="q_${qIdx}"]:checked`);
        if (selected && parseInt(selected.value) === q.correct) score++;
      });

      const total = questions.length;
      const percentage = Math.round((score / total) * 100);

      const submissions = JSON.parse(localStorage.getItem("edu_submissions")) || [];
      submissions.push({
        id: Date.now(),
        userEmail: user.email,
        userName: user.fullName,
        examTitle: exam.title,
        subject: exam.subject || "كيمياء",
        score: score,
        total: total,
        percentage: percentage,
        date: new Date().toLocaleDateString('ar-EG')
      });
      localStorage.setItem("edu_submissions", JSON.stringify(submissions));

      alert(`🎉 تم إنهاء الامتحان!\nنتيجتك: ${score} من ${total} (${percentage}%)`);
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
