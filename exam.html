<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هي كيميا ! - منصة الاختبارات</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .exam-wrapper { max-width: 800px; margin: 40px auto; }
    .question-card { background: #fff; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(12,7,84,0.03); }
    .opt-label { display: flex; align-items: center; gap: 12px; background: #F8F9FC; border: 1px solid var(--border-subtle); padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
    .opt-label:hover { border-color: var(--chem-gold); background: rgba(212, 175, 55, 0.08); }
    .timer-badge { background: rgba(239, 68, 68, 0.1); border: 1px solid #EF4444; color: #EF4444; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .attempts-badge { background: rgba(212, 175, 55, 0.12); border: 1px solid var(--chem-gold); color: #9E7D1C; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .blocked-screen { display: none; text-align: center; padding: 50px 24px; background: #fff; border: 1px solid #EF4444; border-radius: 18px; max-width: 600px; margin: 60px auto; }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="attempts-badge" id="attemptsDisplay">المحاولة: --</span>
        <span class="timer-badge" id="timerDisplay">الوقت: --:--</span>
        <a href="dashboard.html" class="nav-btn-link">خروج</a>
      </div>
    </nav>
  </div>

  <div class="container">
    <div class="blocked-screen" id="blockedScreen">
      <div style="font-size: 48px; margin-bottom: 15px;">🛑</div>
      <h2 style="color: #EF4444; margin-bottom: 12px; font-size: 22px;">عذراً، لقد استنفدت عدد المحاولات المسموحة لهذا الامتحان</h2>
      <p id="blockedDetails" style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px; line-height: 1.8;"></p>
      <a href="dashboard.html" class="btn btn-primary">العودة للوحة التحكم</a>
    </div>
  </div>

  <div class="container exam-wrapper" id="examLayout">
    <div style="margin-bottom:25px; text-align:center;">
      <h1 id="examTitle" style="color:var(--royal-indigo-base); font-size:24px; font-weight:900; margin-bottom:6px;">جاري تحميل الامتحان...</h1>
      <p id="examSubDetails" style="color:var(--text-muted); font-size:14px;"></p>
    </div>

    <form id="examForm">
      <div id="questionsContainer"></div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-size:16px; margin-top:10px;">تسليم الإجابات واعتماد النتيجة</button>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    var user = getCurrentUser();
    if (!user) window.location.href = "login.html";

    var urlParams = new URLSearchParams(window.location.search);
    var examId = urlParams.get("examId") || "e1";
    var exams = JSON.parse(localStorage.getItem("edu_exams")) || [];
    var exam = exams.find(function(e) { return e.id == examId; }) || exams[0];

    if (!exam) {
      showToast("الامتحان غير متاح", "error");
      setTimeout(function() { window.location.href = "dashboard.html"; }, 1000);
    }

    var maxAttempts = Number(exam.maxAttempts) || 1;
    var submissions = JSON.parse(localStorage.getItem("edu_submissions")) || [];
    var myExamSubmissions = submissions.filter(function(s) { return s.userEmail === user.email && s.examId == exam.id; });
    var usedAttempts = myExamSubmissions.length;

    if (usedAttempts >= maxAttempts) {
      document.getElementById("examLayout").style.display = "none";
      document.getElementById("blockedScreen").style.display = "block";
      var highestScore = Math.max.apply(Math, myExamSubmissions.map(function(s) { return s.percentage; }));
      document.getElementById("blockedDetails").innerHTML = "الحد الأقصى المسموح به: <strong>" + maxAttempts + " محاولة</strong><br>عدد مرات خوضك للاختبار: <strong>" + usedAttempts + " مرات</strong><br>أعلى نسبة حققتها: <strong style='color:var(--chem-gold);'>" + highestScore + "%</strong>";
      document.getElementById("attemptsDisplay").innerText = "المحاولات: (" + usedAttempts + "/" + maxAttempts + ")";
    } else {
      var currentAttemptNumber = usedAttempts + 1;
      document.getElementById("attemptsDisplay").innerText = "المحاولة (" + currentAttemptNumber + " من " + maxAttempts + ")";
    }

    document.getElementById("examTitle").innerText = exam.title;
    document.getElementById("examSubDetails").innerText = "المدة: " + exam.durationMinutes + " دقيقة | عدد الأسئلة: " + (exam.questions || []).length + " | الحد الأقصى للمحاولات: " + maxAttempts;

    var timeLeft = (exam.durationMinutes || 15) * 60;
    var timerElem = document.getElementById("timerDisplay");
    var timerInterval = setInterval(function() {
      var mins = Math.floor(timeLeft / 60);
      var secs = timeLeft % 60;
      timerElem.innerText = "الوقت: " + mins.toString().padStart(2, '0') + ":" + secs.toString().padStart(2, '0');
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        showToast("انتهى وقت الامتحان، تم تسليم إجاباتك تلقائياً", "info");
        document.getElementById("examForm").requestSubmit();
      }
      timeLeft--;
    }, 1000);

    var questions = exam.questions || [];
    document.getElementById("questionsContainer").innerHTML = questions.map(function(q, qIdx) {
      return '<div class="question-card">' +
        '<h3 style="color:var(--royal-indigo-base); font-size:16px; font-weight:800; margin-bottom:15px; line-height:1.6;">' + (qIdx + 1) + '. ' + q.q + '</h3>' +
        '<div>' +
          q.options.map(function(opt, oIdx) {
            return '<label class="opt-label">' +
              '<input type="radio" name="q_' + qIdx + '" value="' + oIdx + '" required>' +
              '<span style="color:var(--text-dark); font-size:14px; font-weight:700;">' + opt + '</span>' +
            '</label>';
          }).join('') +
        '</div>' +
      '</div>';
    }).join('');

    document.getElementById("examForm").addEventListener("submit", function(e) {
      e.preventDefault();
      clearInterval(timerInterval);

      var score = 0;
      questions.forEach(function(q, qIdx) {
        var selected = document.querySelector('input[name="q_' + qIdx + '"]:checked');
        if (selected && parseInt(selected.value) === q.correct) score++;
      });

      var total = questions.length;
      var percentage = Math.round((score / total) * 100);

      var allSubs = JSON.parse(localStorage.getItem("edu_submissions")) || [];
      allSubs.push({
        id: Date.now(),
        examId: exam.id,
        userEmail: user.email,
        userName: user.fullName,
        examTitle: exam.title,
        subject: exam.subject || "كيمياء",
        score: score,
        total: total,
        percentage: percentage,
        attemptNumber: usedAttempts + 1,
        date: new Date().toLocaleDateString('ar-EG')
      });
      localStorage.setItem("edu_submissions", JSON.stringify(allSubs));

      showToast("الدرجة: " + score + " من " + total + " (" + percentage + "%)", "success", "تم إنهاء الامتحان");
      setTimeout(function() {
        window.location.href = "dashboard.html";
      }, 1500);
    });
  </script>
</body>
</html>
