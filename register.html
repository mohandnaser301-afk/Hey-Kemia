<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إنشاء حساب جديد - منصة هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(0, 210, 255, 0.09), transparent 50%),
                  radial-gradient(circle at bottom left, rgba(14, 19, 56, 0.06), transparent 50%),
                  #F0F4FC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 0;
      padding: 0;
    }

    .auth-page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 95px 16px 40px;
      box-sizing: border-box;
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle, rgba(226, 232, 240, 0.8));
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(14, 19, 56, 0.08);
      max-width: 580px;
      width: 100%;
      padding: 36px 32px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo-badge {
      width: 52px;
      height: 52px;
      background: rgba(0, 210, 255, 0.12);
      color: #0284C7;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 12px;
    }

    .auth-header h1 {
      font-size: 22px;
      font-weight: 900;
      color: var(--royal-indigo-base, #0E1338);
      margin: 0 0 6px;
    }

    .auth-header p {
      font-size: 13.5px;
      color: var(--text-muted, #64748B);
      margin: 0;
    }

    .step-progress-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      margin-bottom: 28px;
    }

    .step-progress-line {
      position: absolute;
      top: 18px;
      left: 30px;
      right: 30px;
      height: 3px;
      background: #E2E8F0;
      z-index: 1;
    }

    .step-progress-fill {
      position: absolute;
      top: 18px;
      right: 30px;
      height: 3px;
      background: linear-gradient(90deg, #00D2FF, #0284C7);
      z-index: 2;
      transition: width 0.35s ease;
      width: 0%;
    }

    .step-item {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .step-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .step-item.active .step-badge {
      border-color: #00D2FF;
      background: #0E1338;
      color: #00D2FF;
      box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.15);
    }

    .step-item.completed .step-badge {
      border-color: #10B981;
      background: #10B981;
      color: #ffffff;
    }

    .step-label {
      font-size: 11.5px;
      font-weight: 800;
      color: #64748B;
    }

    .step-item.active .step-label {
      color: #0E1338;
    }

    .auth-step-pane {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .auth-step-pane.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group-full {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--royal-indigo-base, #0E1338);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      color: #1E293B;
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--cyan-accent, #00D2FF);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.15);
    }

    .step-nav-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .auth-btn-primary, .auth-btn-secondary {
      height: 48px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      flex: 1;
    }

    .auth-btn-primary {
      background: linear-gradient(135deg, #0E1338 0%, #1D255E 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 10px 25px rgba(14, 19, 56, 0.15);
    }

    .auth-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(14, 19, 56, 0.22);
    }

    .auth-btn-secondary {
      background: #F1F5F9;
      color: #475569;
      border: 1.5px solid #CBD5E1;
    }

    .auth-btn-secondary:hover {
      background: #E2E8F0;
    }

    .auth-footer-nav {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748B;
    }

    .auth-footer-nav a {
      color: #0284C7;
      text-decoration: none;
      font-weight: 800;
    }

    .auth-footer-nav a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .auth-form-grid {
        grid-template-columns: 1fr;
      }
      .auth-card {
        padding: 24px 18px;
      }
      .step-progress-wrapper {
        margin-bottom: 22px;
      }
      .step-badge {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox">
        <a href="login.html" class="nav-btn-link">تسجيل الدخول</a>
      </div>
    </nav>
  </div>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      
      <div class="auth-header">
        <div class="auth-logo-badge">🧪</div>
        <h1>إنشاء حساب طالب جديد</h1>
        <p>انضم إلى منصة الأستاذ محمد السعيد لمتابعة رحلة التفوق</p>
      </div>

      <div class="step-progress-wrapper">
        <div class="step-progress-line"></div>
        <div class="step-progress-fill" id="stepProgressFill"></div>

        <div class="step-item active" id="stepIndicator1">
          <div class="step-badge">1</div>
          <span class="step-label">البيانات الأساسية</span>
        </div>
        <div class="step-item" id="stepIndicator2">
          <div class="step-badge">2</div>
          <span class="step-label">التواصل</span>
        </div>
        <div class="step-item" id="stepIndicator3">
          <div class="step-badge">3</div>
          <span class="step-label">الدراسة</span>
        </div>
      </div>

      <form id="registerForm" autocomplete="off">

        <div class="auth-step-pane active" id="stepPane1">
          <div class="auth-form-grid">
            <div class="form-group form-group-full">
              <label for="fullName">الاسم ثلاثي أو رباعي باللغة العربية *</label>
              <input type="text" id="fullName" placeholder="مثال: أحمد محمود علي إبراهيم" required>
            </div>

            <div class="form-group form-group-full">
              <label for="email">البريد الإلكتروني (Gmail مفعّل) *</label>
              <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group form-group-full">
              <label for="password">كلمة المرور (6 أحرف أو أكثر) *</label>
              <input type="password" id="password" placeholder="••••••••" required minlength="6">
            </div>
          </div>

          <div class="step-nav-actions">
            <button type="button" class="auth-btn-primary" onclick="goToStep(2)">
              <span>المتابعة</span>
              <span>←</span>
            </button>
          </div>
        </div>

        <div class="auth-step-pane" id="stepPane2">
          <div class="auth-form-grid">
            <div class="form-group form-group-full">
              <label for="studentPhone">رقم هاتف الطالب (المسجل عليه واتساب) *</label>
              <input type="tel" id="studentPhone" placeholder="010xxxxxxxx" required>
            </div>

            <div class="form-group form-group-full">
              <label for="parentPhone">رقم هاتف ولي الأمر *</label>
              <input type="tel" id="parentPhone" placeholder="01xxxxxxxxx" required>
            </div>
          </div>

          <div class="step-nav-actions">
            <button type="button" class="auth-btn-secondary" onclick="goToStep(1)">السابق</button>
            <button type="button" class="auth-btn-primary" onclick="goToStep(3)">
              <span>المتابعة</span>
              <span>←</span>
            </button>
          </div>
        </div>

        <div class="auth-step-pane" id="stepPane3">
          <div class="auth-form-grid">
            <div class="form-group">
              <label for="governorate">المحافظة *</label>
              <select id="governorate" required>
                <option value="" disabled selected>اختر المحافظة...</option>
                <option value="كفر الشيخ">كفر الشيخ</option>
                <option value="القاهرة">القاهرة</option>
                <option value="الجيزة">الجيزة</option>
                <option value="الإسكندرية">الإسكندرية</option>
                <option value="الغربية">الغربية</option>
                <option value="الدقهلية">الدقهلية</option>
                <option value="الشرقية">الشرقية</option>
                <option value="المنوفية">المنوفية</option>
                <option value="البحيرة">البحيرة</option>
                <option value="القليوبية">القليوبية</option>
                <option value="دمياط">دمياط</option>
                <option value="بورسعيد">بورسعيد</option>
                <option value="الإسماعيلية">الإسماعيلية</option>
                <option value="السويس">السويس</option>
                <option value="الفيوم">الفيوم</option>
                <option value="بني سويف">بني سويف</option>
                <option value="المنيا">المنيا</option>
                <option value="أسيوط">أسيوط</option>
                <option value="سوهاج">سوهاج</option>
                <option value="قنا">قنا</option>
                <option value="الأقصر">الأقصر</option>
                <option value="أسوان">أسوان</option>
                <option value="مطروح">مطروح</option>
                <option value="شمال سيناء">شمال سيناء</option>
                <option value="جنوب سيناء">جنوب سيناء</option>
                <option value="البحر الأحمر">البحر الأحمر</option>
                <option value="الوادي الجديد">الوادي الجديد</option>
              </select>
            </div>

            <div class="form-group">
              <label for="educationType">نوع التعليم *</label>
              <select id="educationType" required>
                <option value="GENERAL">ثانوي عام</option>
                <option value="AZHAR">ثانوي أزهري</option>
                <option value="LANGUAGES">لغات / تجريبي</option>
              </select>
            </div>

            <div class="form-group form-group-full">
              <label for="schoolName">اسم المدرسة / المعهد</label>
              <input type="text" id="schoolName" placeholder="مثال: الشهيد رياض الثانوية بنين">
            </div>
          </div>

          <div class="step-nav-actions">
            <button type="button" class="auth-btn-secondary" onclick="goToStep(2)">السابق</button>
            <button type="submit" id="btnSubmitRegister" class="auth-btn-primary">
              <span>تأكيد وإنشاء الحساب</span>
              <span>🧪</span>
            </button>
          </div>
        </div>

      </form>

      <div class="auth-footer-nav">
        لديك حساب مسجل بالفعل؟ <a href="login.html">تسجيل الدخول الآن</a>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentStep = 1;
    var isSubmitting = false;

    function goToStep(step) {
      if (step > currentStep) {
        if (currentStep === 1) {
          var name = document.getElementById("fullName").value.trim();
          var email = document.getElementById("email").value.trim();
          var pass = document.getElementById("password").value;

          if (!name) {
            showToast("يرجى إدخال الاسم بالكامل", "info");
            return;
          }
          if (!email || !email.includes("@")) {
            showToast("يرجى إدخال بريد إلكتروني صحيح", "info");
            return;
          }
          if (!pass || pass.length < 6) {
            showToast("كلمة المرور يجب ألا تقل عن 6 أحرف", "info");
            return;
          }
        } else if (currentStep === 2) {
          var sPhone = document.getElementById("studentPhone").value.trim();
          var pPhone = document.getElementById("parentPhone").value.trim();

          if (!sPhone || sPhone.length < 10) {
            showToast("يرجى إدخال رقم هاتف الطالب بشكل صحيح", "info");
            return;
          }
          if (!pPhone || pPhone.length < 10) {
            showToast("يرجى إدخال رقم هاتف ولي الأمر بشكل صحيح", "info");
            return;
          }
        }
      }

      currentStep = step;

      for (var i = 1; i <= 3; i++) {
        var pane = document.getElementById("stepPane" + i);
        var indicator = document.getElementById("stepIndicator" + i);

        if (pane) pane.classList.toggle("active", i === step);

        if (indicator) {
          indicator.classList.remove("active", "completed");
          if (i === step) indicator.classList.add("active");
          else if (i < step) indicator.classList.add("completed");
        }
      }

      var fill = document.getElementById("stepProgressFill");
      if (fill) {
        if (step === 1) fill.style.width = "0%";
        else if (step === 2) fill.style.width = "50%";
        else if (step === 3) fill.style.width = "100%";
      }
    }

    var registerForm = document.getElementById("registerForm");
    var submitBtn = document.getElementById("btnSubmitRegister");

    if (registerForm) {
      registerForm.addEventListener("submit", async function(e) {
        e.preventDefault();

        var gov = document.getElementById("governorate").value;
        if (!gov) {
          showToast("يرجى اختيار المحافظة", "info");
          return;
        }

        if (isSubmitting) return;
        isSubmitting = true;

        var originalBtnHtml = submitBtn ? submitBtn.innerHTML : "<span>تأكيد وإنشاء الحساب</span>";
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.style.opacity = "0.7";
          submitBtn.style.cursor = "not-allowed";
          submitBtn.innerHTML = "<span>جاري التحقق وإنشاء الحساب...</span>";
        }

        try {
          var userData = {
            fullName: document.getElementById("fullName").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            studentPhone: document.getElementById("studentPhone").value.trim(),
            parentPhone: document.getElementById("parentPhone").value.trim(),
            governorate: document.getElementById("governorate").value,
            educationType: document.getElementById("educationType").value,
            schoolName: document.getElementById("schoolName").value.trim() || "غير محدد"
          };

          await window.FirebaseService.registerStudent(userData);

          if (typeof showToast === "function") {
            showToast("تم إنشاء الحساب بنجاح! تم إرسال رابط تأكيد إلى بريدك الإلكتروني.", "success", "نجاح التسجيل");
          }

          setTimeout(function() {
            window.location.href = "login.html";
          }, 1800);

        } catch (err) {
          if (typeof showToast === "function") {
            showToast(err.message || "تعذر إتمام التسجيل، يرجى المحاولة مرة أخرى.", "error", "خطأ في البيانات");
          } else {
            alert(err.message || "تعذر إتمام التسجيل");
          }

          isSubmitting = false;
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
            submitBtn.style.cursor = "pointer";
            submitBtn.innerHTML = originalBtnHtml;
          }
        }
      });
    }
  </script>
</body>
</html>
