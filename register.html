<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هي كيميا ! - إنشاء حسابك الآن</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-split-wrapper { display: grid; grid-template-columns: 420px 1fr; min-height: 580px; background: #fff; border-radius: var(--radius-lg); margin: 30px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border-subtle); }
    .auth-sidebar-banner { background: var(--primary-navy); padding: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
    .auth-main-form-area { padding: 45px 50px; display: flex; flex-direction: column; justify-content: center; }
    .stepper-header { display: flex; justify-content: space-between; position: relative; margin-bottom: 30px; }
    .stepper-header::before { content: ''; position: absolute; top: 18px; left: 30px; right: 30px; height: 2px; background: #E2E8F0; z-index: 1; }
    .step-item { position: relative; z-index: 2; text-align: center; background: #fff; padding: 0 8px; }
    .step-circle { width: 34px; height: 34px; border-radius: 50%; background: #F1F5F9; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-weight: 800; margin: 0 auto 6px; border: 2px solid #E2E8F0; }
    .step-item.active .step-circle { background: var(--chem-gold); color: #fff; border-color: var(--chem-gold); }
    .step-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .step-item.active .step-label { color: var(--primary-navy); }
    .wizard-step { display: none; }
    .wizard-step.active { display: block; }
    @media (max-width: 900px) { .auth-split-wrapper { grid-template-columns: 1fr; } .auth-sidebar-banner { display: none; } .auth-main-form-area { padding: 30px 20px; } }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <a href="login.html" class="nav-btn-link">تسجيل الدخول</a>
    </nav>
  </div>

  <div class="container">
    <div class="auth-split-wrapper">
      
      <div class="auth-sidebar-banner">
        <div class="capsule-logo" style="width:50px; height:50px; font-size:18px; margin-bottom:15px;">HK</div>
        <h3 style="font-size:22px; font-weight:900; color:#fff; margin-bottom:8px;">منصة هي كيميا !</h3>
        <p style="font-size:13px; color:#94A3B8;">المنظومة المتخصصة لكيمياء الثانوية العامة والأزهر</p>
      </div>

      <div class="auth-main-form-area">
        
        <div class="stepper-header">
          <div class="step-item active" id="stHeader1">
            <div class="step-circle">1</div>
            <div class="step-label">البيانات الأساسية</div>
          </div>
          <div class="step-item" id="stHeader2">
            <div class="step-circle">2</div>
            <div class="step-label">البيانات الدراسية</div>
          </div>
          <div class="step-item" id="stHeader3">
            <div class="step-circle">3</div>
            <div class="step-label">بيانات ولي الأمر</div>
          </div>
        </div>

        <div style="text-align:center; margin-bottom:20px;">
          <h2 style="font-size:22px; font-weight:900; color:var(--primary-navy);">أنشئ حسابك الآن :</h2>
          <p style="color:var(--text-muted); font-size:13px;">ادخل بياناتك بشكل صحيح لتفعيل الحساب</p>
        </div>

        <form id="wizardRegisterForm">
          
          <div class="wizard-step active" id="wStep1">
            <div class="form-row">
              <div class="form-group" style="flex:1;">
                <label>الاسم الأول:</label>
                <input type="text" id="regFirstName" placeholder="مثال: أحمد" required>
              </div>
              <div class="form-group" style="flex:1;">
                <label>الاسم الأخير / العائلة:</label>
                <input type="text" id="regLastName" placeholder="مثال: علي حسن" required>
              </div>
            </div>

            <div class="form-group">
              <label>رقم هاتف الطالب (واتساب):</label>
              <input type="tel" id="regStudentPhone" placeholder="01xxxxxxxxx" required>
            </div>

            <button type="button" class="btn btn-primary" style="width:100%; padding:12px; margin-top:10px;" onclick="goToStep(2)">التالي ←</button>
          </div>

          <div class="wizard-step" id="wStep2">
            <div class="form-group">
              <label>المحافظة:</label>
              <select id="regGovernorate" required>
                <option value="كفر الشيخ" selected>كفر الشيخ</option>
                <option value="القاهرة">القاهرة</option>
                <option value="الإسكندرية">الإسكندرية</option>
                <option value="الغربية">الغربية</option>
                <option value="الدقهلية">الدقهلية</option>
                <option value="الجيزة">الجيزة</option>
              </select>
            </div>

            <div class="form-group">
              <label>اسم المدرسة الحالية:</label>
              <input type="text" id="regSchoolName" placeholder="اكتب اسم مدرستك" required>
            </div>

            <div class="form-group">
              <label>نوع التعليم:</label>
              <div style="display:flex; gap:20px; padding:6px 0;">
                <label style="cursor:pointer;"><input type="radio" name="regEduType" value="GENERAL" checked> ثانوي عام</label>
                <label style="cursor:pointer;"><input type="radio" name="regEduType" value="AZHAR"> ثانوي أزهر</label>
              </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:10px;">
              <button type="button" class="btn btn-outline" style="flex:1;" onclick="goToStep(1)">→ السابق</button>
              <button type="button" class="btn btn-primary" style="flex:2;" onclick="goToStep(3)">التالي ←</button>
            </div>
          </div>

          <div class="wizard-step" id="wStep3">
            <div class="form-group">
              <label>رقم هاتف ولي الأمر:</label>
              <input type="tel" id="regParentPhone" placeholder="01xxxxxxxxx" required>
            </div>

            <div class="form-group">
              <label>البريد الإلكتروني:</label>
              <input type="email" id="regEmail" placeholder="student@example.com" required>
            </div>

            <div class="form-row">
              <div class="form-group" style="flex:1;">
                <label>كلمة السر:</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
              </div>
              <div class="form-group" style="flex:1;">
                <label>تأكيد كلمة السر:</label>
                <input type="password" id="regPasswordConfirm" placeholder="••••••••" required>
              </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:10px;">
              <button type="button" class="btn btn-outline" style="flex:1;" onclick="goToStep(2)">→ السابق</button>
              <button type="submit" class="btn btn-gold" style="flex:2;">إنشاء الحساب والبدء 🚀</button>
            </div>
          </div>

        </form>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function goToStep(stepNumber) {
      if (stepNumber === 2) {
        var fName = document.getElementById("regFirstName").value.trim();
        var lName = document.getElementById("regLastName").value.trim();
        var phone = document.getElementById("regStudentPhone").value.trim();
        if (!fName || !lName || !phone) {
          alert("يرجى ملء الاسم ورقم الهاتف أولاً!");
          return;
        }
      } else if (stepNumber === 3) {
        var school = document.getElementById("regSchoolName").value.trim();
        if (!school) {
          alert("يرجى إدخال اسم مدرستك!");
          return;
        }
      }

      document.querySelectorAll(".wizard-step").forEach(function(el) { el.classList.remove("active"); });
      document.querySelectorAll(".step-item").forEach(function(el) { el.classList.remove("active"); });

      document.getElementById("wStep" + stepNumber).classList.add("active");
      for (var i = 1; i <= stepNumber; i++) {
        document.getElementById("stHeader" + i).classList.add("active");
      }
    }

    document.getElementById("wizardRegisterForm").addEventListener("submit", function(e) {
      e.preventDefault();
      var pass = document.getElementById("regPassword").value;
      var passConf = document.getElementById("regPasswordConfirm").value;

      if (pass !== passConf) {
        alert("❌ كلمة السر غير متطابقة!");
        return;
      }

      var email = document.getElementById("regEmail").value.trim().toLowerCase();
      var users = JSON.parse(localStorage.getItem("edu_users")) || [];

      if (users.some(function(u) { return u.email.toLowerCase() === email; })) {
        alert("❌ هذا البريد الإلكتروني مسجل بالفعل!");
        return;
      }

      var newUser = {
        fullName: document.getElementById("regFirstName").value.trim() + " " + document.getElementById("regLastName").value.trim(),
        email: email,
        password: pass,
        studentPhone: document.getElementById("regStudentPhone").value.trim(),
        parentPhone: document.getElementById("regParentPhone").value.trim(),
        governorate: document.getElementById("regGovernorate").value,
        schoolName: document.getElementById("regSchoolName").value.trim(),
        educationType: document.querySelector('input[name="regEduType"]:checked').value,
        role: "STUDENT",
        enrolledCourses: [],
        courseAccessCount: {}
      };

      users.push(newUser);
      localStorage.setItem("edu_users", JSON.stringify(users));
      alert("🎉 تم إنشاء حسابك بنجاح! يمكنك الآن تسجيل الدخول.");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
