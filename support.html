<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شات الدعم الفني والطلاب - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 85px 16px 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .chat-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 78vh;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .chat-header {
      background: var(--royal-indigo-base);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #F8FAFC;
    }
    .chat-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      position: relative;
    }
    .chat-bubble.mine {
      align-self: flex-start;
      background: #00D2FF;
      color: #080A21;
      font-weight: 700;
      border-bottom-right-radius: 2px;
    }
    .chat-bubble.other {
      align-self: flex-end;
      background: #ffffff;
      color: var(--royal-indigo-base);
      border: 1px solid #E2E8F0;
      border-bottom-left-radius: 2px;
    }
    .bubble-meta {
      font-size: 10.5px;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      opacity: 0.8;
    }
    .chat-input-bar {
      padding: 14px 16px;
      background: #ffffff;
      border-top: 1px solid #E2E8F0;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox"></div>
    </nav>
  </div>

  <div class="chat-layout">
    <div class="chat-card">
      <div class="chat-header">
        <div>
          <h2 style="font-size: 16px; font-weight: 900;">💬 شات الدعم الفني والرد على الاستفسارات</h2>
          <span style="font-size: 12px; color: #00D2FF;" id="chatStatusText">متصل بالسحابة الآن</span>
        </div>
        <a href="dashboard.html" class="nav-btn-link" style="color:#fff; background:rgba(255,255,255,0.12);">الرجوع للوحة التحكم</a>
      </div>

      <div class="chat-messages-box" id="chatMessagesContainer">
        <div style="text-align:center; color:var(--text-muted); font-size:13px; margin:auto;">جاري جلب الرسائل السحابية...</div>
      </div>

      <form class="chat-input-bar" id="chatSendMessageForm">
        <input type="text" id="chatMessageInput" placeholder="اكتب استفسارك أو رسالتك هنا..." required autocomplete="off">
        <button type="submit" class="btn btn-primary" style="padding: 10px 22px;">إرسال 🚀</button>
      </form>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentUser = null;

    function renderMessages(messages) {
      var container = document.getElementById("chatMessagesContainer");
      if (!container) return;

      if (!messages || messages.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13.5px; margin:auto;">مرحباً بك! لا توجد رسائل سابقة. يمكنك كتابة استفسارك وسيقوم فريق الدعم بالرد عليك فوراً.</div>';
        return;
      }

      container.innerHTML = messages.map(function(m) {
        var isMine = currentUser && (m.senderEmail === currentUser.email.toLowerCase());
        var timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }) : "";
        var roleTag = m.senderRole === "ADMIN" || m.senderRole === "SUPER_ADMIN" ? "👑 الإدارة" : (m.senderRole === "SUPPORT" ? "🛡️ الدعم" : "👨‍🎓 طالب");

        return '<div class="chat-bubble ' + (isMine ? 'mine' : 'other') + '">' +
          '<div>' + sanitizeText(m.text) + '</div>' +
          '<div class="bubble-meta">' +
            '<span>' + sanitizeText(m.senderName) + ' (' + roleTag + ')</span>' +
            '<span>' + timeStr + '</span>' +
          '</div>' +
        '</div>';
      }).join("");

      container.scrollTop = container.scrollHeight;
    }

    document.addEventListener("DOMContentLoaded", function() {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = "login.html?redirect=support.html";
        return;
      }

      var interval = setInterval(function() {
        if (window.FirebaseService && window.firebase && firebase.firestore) {
          clearInterval(interval);
          window.FirebaseService.subscribeSupportMessages(function(messages) {
            renderMessages(messages);
          });
        }
      }, 250);

      document.getElementById("chatSendMessageForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        var input = document.getElementById("chatMessageInput");
        var text = input.value.trim();
        if (!text) return;

        input.value = "";
        try {
          await window.FirebaseService.sendSupportMessage({
            text: text,
            senderEmail: currentUser.email.toLowerCase(),
            senderName: currentUser.fullName,
            senderRole: currentUser.role || "STUDENT"
          });
        } catch (err) {
          showToast("تعذر إرسال الرسالة: " + err.message, "error");
        }
      });
    });
  </script>
</body>
</html>
