<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مركز الدعم الفني والاستفسارات - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .support-page-wrapper {
      min-height: 100vh;
      padding: 85px 16px 30px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .support-grid-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      height: 78vh;
    }
    .support-sidebar-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .quick-faq-btn {
      width: 100%;
      text-align: right;
      padding: 10px 12px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--royal-indigo-base);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .quick-faq-btn:hover {
      background: rgba(0,210,255,0.12);
      border-color: var(--cyan-accent);
    }
    .chat-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .chat-header {
      background: var(--royal-indigo-base);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #F8FAFC;
    }
    .chat-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      position: relative;
    }
    .chat-bubble.mine {
      align-self: flex-start;
      background: #00D2FF;
      color: #080A21;
      font-weight: 700;
      border-bottom-right-radius: 2px;
    }
    .chat-bubble.other {
      align-self: flex-end;
      background: #ffffff;
      color: var(--royal-indigo-base);
      border: 1px solid #E2E8F0;
      border-bottom-left-radius: 2px;
    }
    .bubble-meta {
      font-size: 10px;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      opacity: 0.85;
    }
    .chat-input-bar {
      padding: 12px 16px;
      background: #ffffff;
      border-top: 1px solid #E2E8F0;
      display: flex;
      gap: 10px;
    }
    @media (max-width: 860px) {
      .support-grid-layout { grid-template-columns: 1fr; height: auto; }
      .chat-card { height: 65vh; }
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox"></div>
    </nav>
  </div>

  <div class="support-page-wrapper">
    <div class="support-grid-layout">
      
      <!-- القائمة الجانبية الذكية -->
      <aside class="support-sidebar-card">
        <div style="border-bottom:1px solid #EEF2F6; padding-bottom:12px;">
          <h3 style="font-size:15px; font-weight:900; color:var(--royal-indigo-base); margin-bottom:4px;">مركز الدعم الذكي 🧪</h3>
          <p style="font-size:12px; color:var(--text-muted);">فريق الأستاذ محمد السعيد معك لحظة بلحظة</p>
        </div>

        <div>
          <label style="font-size:11.5px; font-weight:800; color:#64748B; margin-bottom:6px; display:block;">تصنيف الاستفسار:</label>
          <select id="supportCategorySelect" style="font-size:12.5px; padding:8px 12px;">
            <option value="GENERAL">استفسار عام</option>
            <option value="PAYMENT">تفعيل كورس / إيصال دفع</option>
            <option value="EXAM">استفسار بخصوص امتحان</option>
            <option value="TECH">مشكلة تقنية / تشغيل فيديو</option>
          </select>
        </div>

        <div style="margin-top:auto; padding-top:12px; border-top:1px solid #EEF2F6;">
          <a href="https://wa.me/201012345678" target="_blank" class="btn btn-cyan" style="width:100%; text-decoration:none; font-size:12px; text-align:center;">💬 محادثة واتساب السريعة</a>
        </div>
      </aside>

      <!-- شات الدعم المباشر -->
      <main class="chat-card">
        <div class="chat-header">
          <div>
            <h2 style="font-size: 15px; font-weight: 900;">💬 المحادثة المباشرة مع الدعم الفني</h2>
            <span style="font-size: 11.5px; color: #00D2FF;">متصل بالسحابة اللحظية ✓</span>
          </div>
          <a href="dashboard.html" class="nav-btn-link" style="color:#fff; background:rgba(255,255,255,0.12);">لوحة التحكم</a>
        </div>

        <div class="chat-messages-box" id="chatMessagesContainer">
          <div style="text-align:center; color:var(--text-muted); font-size:13px; margin:auto;">جاري جلب الرسائل السحابية...</div>
        </div>

        <form class="chat-input-bar" id="chatSendMessageForm">
          <input type="text" id="chatMessageInput" placeholder="اكتب استفسارك أو سؤالك هنا..." required autocomplete="off">
          <button type="submit" class="btn btn-primary" style="padding: 10px 22px;">إرسال 🚀</button>
        </form>
      </main>

    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentUser = null;

    function renderMessages(messages) {
      var container = document.getElementById("chatMessagesContainer");
      if (!container) return;

      if (!messages || messages.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13px; margin:auto;">مرحباً بك! لا توجد رسائل سابقة. تفضل بكتابة استفسارك وسنرد عليك فوراً.</div>';
        return;
      }

      container.innerHTML = messages.map(function(m) {
        var isMine = currentUser && (m.senderEmail.toLowerCase() === currentUser.email.toLowerCase());
        var timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }) : "";
        var roleTag = m.senderRole === "ADMIN" || m.senderRole === "SUPER_ADMIN" ? "👑 الإدارة" : (m.senderRole === "SUPPORT" ? "🛡️ الدعم" : "👨‍🎓 طالب");

        return '<div class="chat-bubble ' + (isMine ? 'mine' : 'other') + '">' +
          '<div>' + sanitizeText(m.text) + '</div>' +
          '<div class="bubble-meta">' +
            '<span>' + sanitizeText(m.senderName) + ' (' + roleTag + ')</span>' +
            '<span>' + timeStr + '</span>' +
          '</div>' +
        '</div>';
      }).join("");

      container.scrollTop = container.scrollHeight;
    }

    document.addEventListener("DOMContentLoaded", function() {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = "login.html?redirect=support.html";
        return;
      }

      var interval = setInterval(function() {
        if (window.FirebaseService && window.firebase && firebase.firestore) {
          clearInterval(interval);
          window.FirebaseService.subscribeSupportMessages(function(messages) {
            renderMessages(messages);
          });
        }
      }, 250);

      document.getElementById("chatSendMessageForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        var input = document.getElementById("chatMessageInput");
        var text = input.value.trim();
        var cat = document.getElementById("supportCategorySelect").value;
        if (!text) return;

        input.value = "";
        try {
          await window.FirebaseService.sendSupportMessage({
            text: text,
            category: cat,
            senderEmail: currentUser.email.toLowerCase().trim(),
            senderName: currentUser.fullName,
            senderRole: currentUser.role || "STUDENT"
          });
        } catch (err) {
          showToast("تعذر إرسال الرسالة: " + err.message, "error");
        }
      });
    });
  </script>
</body>
</html>
