<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الدعم الفني والأسئلة - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .support-container-fluid {
      min-height: 100vh;
      padding: 85px 16px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .support-thread-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
      height: 78vh;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .threads-sidebar {
      background: #F8FAFC;
      border-left: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
    }
    .thread-item {
      padding: 12px 14px;
      border-bottom: 1px solid #E2E8F0;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .thread-item:hover, .thread-item.active {
      background: #EDF2F7;
    }
    .thread-item.active {
      border-right: 3px solid var(--cyan-accent);
    }
    .chat-view-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .chat-view-header {
      background: var(--royal-indigo-base);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #FAFBFD;
    }
    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .msg-bubble.mine {
      align-self: flex-start;
      background: var(--royal-indigo-base);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .msg-bubble.other {
      align-self: flex-end;
      background: #E2E8F0;
      color: #0F172A;
      border-bottom-left-radius: 2px;
    }
    .msg-time {
      font-size: 10px;
      opacity: 0.75;
      margin-top: 3px;
      display: block;
      text-align: left;
    }
    .chat-input-row {
      padding: 12px 16px;
      background: #ffffff;
      border-top: 1px solid #E2E8F0;
      display: flex;
      gap: 10px;
    }
    @media (max-width: 860px) {
      .support-thread-layout { grid-template-columns: 1fr; height: 75vh; }
      .threads-sidebar { display: none; }
      .threads-sidebar.show-mobile-threads { display: flex; }
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox"></div>
    </nav>
  </div>

  <div class="support-container-fluid">
    <div class="support-thread-layout">
      
      <!-- قائمة محادثات الطلاب (للأدمن والدعم فقط) -->
      <aside class="threads-sidebar" id="adminThreadsSidebar" style="display:none;">
        <div style="padding:14px; border-bottom:1px solid #E2E8F0; background:#fff;">
          <h3 style="font-size:14px; font-weight:800; color:var(--royal-indigo-base);">محادثات الطلاب</h3>
        </div>
        <div id="threadsListContainer" style="overflow-y:auto; flex:1;"></div>
      </aside>

      <!-- منطقة الشات والمراسلة -->
      <main class="chat-view-pane">
        <div class="chat-view-header">
          <div>
            <h2 style="font-size:15px; font-weight:800;" id="chatTargetNameDisplay">الدعم الفني</h2>
            <span style="font-size:11.5px; color:#00D2FF;" id="chatTargetSubDisplay">فريق الأستاذ محمد السعيد</span>
          </div>
          <a href="dashboard.html" class="nav-btn-link" style="color:#fff; background:rgba(255,255,255,0.12);">الرجوع</a>
        </div>

        <div class="chat-messages-area" id="supportChatMessagesArea">
          <div style="text-align:center; color:var(--text-muted); font-size:13px; margin:auto;">جاري تحميل المحادثة...</div>
        </div>

        <form class="chat-input-row" id="sendSupportMsgForm">
          <input type="text" id="supportTextInput" placeholder="اكتب رسالتك أو استفسارك هنا..." required autocomplete="off">
          <button type="submit" class="btn btn-primary" style="padding: 9px 20px;">إرسال</button>
        </form>
      </main>

    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentUser = null;
    var activeThreadEmail = null;
    var activeThreadName = null;

    function selectThread(studentEmail, studentName) {
      activeThreadEmail = studentEmail.toLowerCase().trim();
      activeThreadName = studentName;
      document.getElementById("chatTargetNameDisplay").innerText = studentName;
      document.getElementById("chatTargetSubDisplay").innerText = studentEmail;

      document.querySelectorAll(".thread-item").forEach(el => {
        el.classList.toggle("active", el.getAttribute("data-email") === activeThreadEmail);
      });

      if (window.FirebaseService) {
        window.FirebaseService.subscribeStudentSupport(activeThreadEmail, renderThreadMessages);
      }
    }

    function renderThreadMessages(messages) {
      var container = document.getElementById("supportChatMessagesArea");
      if (!container) return;

      if (!messages || messages.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13px; margin:auto;">لا توجد رسائل سابقة في هذه المحادثة.</div>';
        return;
      }

      container.innerHTML = messages.map(m => {
        var isMine = currentUser && (m.senderEmail.toLowerCase().trim() === currentUser.email.toLowerCase().trim());
        var timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }) : "";
        return '<div class="msg-bubble ' + (isMine ? 'mine' : 'other') + '">' +
          '<div>' + sanitizeText(m.text) + '</div>' +
          '<span class="msg-time">' + timeStr + '</span>' +
        '</div>';
      }).join("");

      container.scrollTop = container.scrollHeight;
    }

    document.addEventListener("DOMContentLoaded", function() {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = "login.html?redirect=support.html";
        return;
      }

      var isStaff = currentUser.role === "SUPER_ADMIN" || currentUser.role === "ADMIN" || currentUser.role === "SUPPORT";

      if (isStaff) {
        var sidebar = document.getElementById("adminThreadsSidebar");
        if (sidebar) sidebar.style.display = "flex";

        var interval = setInterval(function() {
          if (window.FirebaseService && window.firebase && firebase.firestore) {
            clearInterval(interval);
            window.FirebaseService.subscribeAllSupportThreads(threads => {
              var container = document.getElementById("threadsListContainer");
              if (!container) return;

              if (threads.length === 0) {
                container.innerHTML = '<div style="padding:15px; font-size:12px; color:#64748B; text-align:center;">لا توجد محادثات طلاب بعد.</div>';
                return;
              }

              container.innerHTML = threads.map(t => {
                var isSelected = activeThreadEmail === t.studentEmail;
                return '<div class="thread-item ' + (isSelected ? 'active' : '') + '" data-email="' + t.studentEmail + '" onclick="selectThread(\'' + t.studentEmail + '\', \'' + t.studentName.replace(/'/g, "\\'") + '\')">' +
                  '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">' +
                    '<strong style="font-size:13px; color:var(--royal-indigo-base);">' + t.studentName + '</strong>' +
                    (t.unreadCount > 0 ? '<span style="background:#ef4444; color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:10px;">' + t.unreadCount + '</span>' : '') +
                  '</div>' +
                  '<p style="font-size:11.5px; color:#64748B; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:0;">' + (t.lastMessage || "") + '</p>' +
                '</div>';
              }).join("");

              if (!activeThreadEmail && threads[0]) {
                selectThread(threads[0].studentEmail, threads[0].studentName);
              }
            });
          }
        }, 250);

      } else {
        activeThreadEmail = currentUser.email.toLowerCase().trim();
        activeThreadName = currentUser.fullName;

        var intervalStudent = setInterval(function() {
          if (window.FirebaseService && window.firebase && firebase.firestore) {
            clearInterval(intervalStudent);
            window.FirebaseService.subscribeStudentSupport(activeThreadEmail, renderThreadMessages);
          }
        }, 250);
      }

      document.getElementById("sendSupportMsgForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        var input = document.getElementById("supportTextInput");
        var text = input.value.trim();
        if (!text || !activeThreadEmail) return;

        input.value = "";
        try {
          await window.FirebaseService.sendSupportMessage({
            studentEmail: activeThreadEmail,
            studentName: activeThreadName || activeThreadEmail,
            text: text,
            senderEmail: currentUser.email.toLowerCase().trim(),
            senderName: currentUser.fullName,
            senderRole: currentUser.role || "STUDENT"
          });
        } catch (err) {
          showToast("تعذر إرسال الرسالة: " + err.message, "error");
        }
      });
    });
  </script>
</body>
</html>
