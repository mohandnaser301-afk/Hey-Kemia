<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شات الدعم والأسئلة الأكاديمية - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #F0F4FC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .support-chat-container {
      max-width: 1100px;
      width: 100%;
      margin: 85px auto 20px;
      padding: 0 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .support-chat-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(14, 19, 56, 0.08);
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      min-height: 560px;
      max-height: calc(100vh - 125px);
      overflow: hidden;
      position: relative;
    }

    /* الشريط الجانبي للمحادثات */
    .support-threads-sidebar {
      background: #F8FAFC;
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .threads-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: #ffffff;
    }

    .threads-header h3 {
      font-size: 15px;
      font-weight: 900;
      color: var(--royal-indigo-base);
      margin-bottom: 8px;
    }

    .threads-search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
      box-sizing: border-box;
    }

    .threads-search-input:focus {
      border-color: var(--cyan-accent);
    }

    .threads-list {
      flex: 1;
      overflow-y: auto;
    }

    .thread-item-row {
      padding: 12px 14px;
      border-bottom: 1px solid #EEF2F6;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .thread-item-row:hover, .thread-item-row.active {
      background: rgba(0, 210, 255, 0.08);
    }

    .thread-info-box {
      flex: 1;
      min-width: 0;
    }

    .thread-name-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--royal-indigo-base);
      margin-bottom: 3px;
    }

    .thread-preview-msg {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-actions-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-delete-thread {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 15px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-delete-thread:hover {
      background: #FEE2E2;
      color: #EF4444;
      transform: scale(1.1);
    }

    /* نافذة الدردشة الرئيسية */
    .chat-conversation-area {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #ffffff;
      position: relative;
    }

    .chat-convo-header {
      padding: 12px 20px;
      background: var(--royal-indigo-base);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .chat-convo-header h3 {
      font-size: 14.5px;
      font-weight: 900;
      margin: 0 0 2px;
    }

    .chat-convo-header span {
      font-size: 11.5px;
      color: var(--cyan-accent);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chat-convo-header span::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #10B981;
      border-radius: 50%;
      display: inline-block;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear-chat-history {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear-chat-history:hover {
      background: #EF4444;
      color: #ffffff;
    }

    .chat-back-btn {
      display: none;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .messages-stream-box {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at center, #FFFFFF 0%, #F8FAFC 100%);
    }

    .chat-bubble {
      max-width: 78%;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
      animation: fadeInBubble 0.2s ease forwards;
    }

    @keyframes fadeInBubble {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-bubble.student {
      align-self: flex-start;
      background: #F1F5F9;
      color: #0E1338;
      border-bottom-right-radius: 3px;
      border: 1px solid #E2E8F0;
    }

    .chat-bubble.staff {
      align-self: flex-end;
      background: linear-gradient(135deg, #0E1338 0%, #1D255E 100%);
      color: #ffffff;
      border-bottom-left-radius: 3px;
      box-shadow: 0 4px 12px rgba(14, 19, 56, 0.12);
    }

    .chat-bubble .bubble-sender {
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 3px;
      color: #0284C7;
    }

    .chat-bubble.staff .bubble-sender {
      color: #00D2FF;
    }

    .chat-bubble .bubble-time {
      display: block;
      font-size: 10px;
      opacity: 0.75;
      margin-top: 4px;
      text-align: left;
    }

    .chat-input-bar-form {
      padding: 12px 16px;
      border-top: 1px solid #EEF2F6;
      background: #ffffff;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input-bar-form input {
      flex: 1;
      height: 44px;
      padding: 0 14px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      font-size: 13.5px;
      outline: none;
    }

    .chat-input-bar-form input:focus {
      border-color: var(--cyan-accent);
      background: #ffffff;
    }

    .chat-input-bar-form button {
      padding: 0 20px;
      height: 44px;
      background: var(--royal-indigo-base);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-input-bar-form button:hover {
      background: var(--royal-indigo-light);
    }

    @media (max-width: 768px) {
      .support-chat-card {
        grid-template-columns: 1fr;
        height: calc(100vh - 105px);
        border-radius: 14px;
      }

      .support-threads-sidebar.hide-mobile {
        display: none !important;
      }

      .chat-conversation-area.active-mobile {
        display: flex !important;
        width: 100%;
        height: 100%;
      }

      .chat-back-btn {
        display: inline-flex;
      }
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox"></div>
    </nav>
  </div>

  <main class="support-chat-container">
    <div class="support-chat-card">
      
      <!-- الشريط الجانبي للإدارة والمساعدين -->
      <div class="support-threads-sidebar" id="supportThreadsSidebar" style="display:none;">
        <div class="threads-header">
          <h3>استفسارات الطلاب</h3>
          <input type="text" id="threadsSearchInput" class="threads-search-input" placeholder="بحث باسم الطالب أو الهاتف..." oninput="filterThreadsList(this.value)">
        </div>
        <div class="threads-list" id="supportThreadsListContainer"></div>
      </div>

      <!-- نافذة المحادثة المباشرة -->
      <div class="chat-conversation-area" id="chatConvoArea">
        <div class="chat-convo-header">
          <div>
            <h3 id="chatTargetNameDisplay">الدعم الفني والأكاديمي</h3>
            <span id="chatTargetSubDisplay">فريق الأستاذ محمد السعيد</span>
          </div>

          <div class="chat-header-actions">
            <button type="button" id="btnClearCurrentChat" class="btn-clear-chat-history" style="display:none;" onclick="deleteCurrentOpenChat()">مسح المحادثة 🗑️</button>
            <button type="button" class="chat-back-btn" onclick="closeThreadOnMobile()">← المحادثات</button>
          </div>
        </div>

        <div class="messages-stream-box" id="messagesStreamBox"></div>

        <form class="chat-input-bar-form" id="chatSendMessageForm">
          <input type="text" id="chatMessageInput" placeholder="اكتب سؤالك أو استفسارك هنا..." required autocomplete="off">
          <button type="submit" id="chatSendBtn">
            <span>إرسال</span>
            <span>✉️</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentSelectedStudentUid = null;
    var unsubscribeMessages = null;
    var cachedThreads = [];

    function formatChatTime(dateStr) {
      if (!dateStr) return "";
      var d = new Date(dateStr);
      return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
    }

    function renderMessages(messages) {
      var box = document.getElementById("messagesStreamBox");
      if (!box) return;

      var currentUser = getCurrentUser();

      if (!messages || messages.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:#64748B; font-size:13px; margin:auto;">أهلاً بك! اكتب سؤالك أو مشكلتك هنا وسيقوم الفريق الأكاديمي بالرد عليك فوراً. 🧪</div>';
        return;
      }

      box.innerHTML = messages.map(function(m) {
        var isMe = currentUser && (m.senderUid === currentUser.uid || m.senderEmail === currentUser.email);
        var isStaff = m.senderRole === "SUPER_ADMIN" || m.senderRole === "ADMIN" || m.senderRole === "SUPPORT";
        var bubbleClass = isMe ? "staff" : "student";
        var senderLabel = isMe ? "أنت" : sanitizeText(m.senderName || (isStaff ? "فريق أ/ محمد السعيد" : "الطالب"));

        return '<div class="chat-bubble ' + bubbleClass + '">' +
          '<div class="bubble-sender">' + senderLabel + '</div>' +
          '<div>' + sanitizeText(m.text) + '</div>' +
          '<span class="bubble-time">' + formatChatTime(m.createdAt) + '</span>' +
        '</div>';
      }).join("");

      box.scrollTop = box.scrollHeight;
    }

    // استرجاع رسائل الشات مع تصفية الرسائل السابقة لتاريخ التصفير (clearedAt)
    function subscribeToStudentChatRealtime(studentUid) {
      if (unsubscribeMessages) unsubscribeMessages();

      if (window.FirebaseService && window.firebase && firebase.firestore) {
        var db = firebase.firestore();
        
        // التحقق من تاريخ التصفير إن وجد
        db.collection("support_threads").doc(studentUid).get().then(function(threadDoc) {
          var clearedAt = (threadDoc.exists && threadDoc.data().clearedAt) ? threadDoc.data().clearedAt : null;

          unsubscribeMessages = db.collection("support_messages")
            .where("studentUid", "==", studentUid)
            .onSnapshot(function(snap) {
              var list = [];
              snap.forEach(function(doc) {
                var data = doc.data();
                data.id = doc.id;
                // حجب أي رسالة قديمة سبقت عملية الحذف
                if (!clearedAt || (data.createdAt && data.createdAt > clearedAt)) {
                  list.push(data);
                }
              });

              list.sort(function(a, b) {
                return new Date(a.createdAt || 0) - new Date(b.createdAt || 0);
              });

              renderMessages(list);
            });
        });
      } else {
        var localMsgs = JSON.parse(localStorage.getItem("edu_chat_" + studentUid)) || [];
        renderMessages(localMsgs);
      }
    }

    function selectStudentThread(studentUid, studentName, studentPhone) {
      currentSelectedStudentUid = studentUid;
      document.getElementById("chatTargetNameDisplay").innerText = studentName;
      document.getElementById("chatTargetSubDisplay").innerText = studentPhone || "طالب مسجل";

      var user = getCurrentUser();
      var isStaff = user && (user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT");
      var clearBtn = document.getElementById("btnClearCurrentChat");
      if (clearBtn) clearBtn.style.display = isStaff ? "inline-flex" : "none";

      document.querySelectorAll(".thread-item-row").forEach(el => el.classList.remove("active"));
      var activeEl = document.getElementById("threadRow_" + studentUid);
      if (activeEl) activeEl.classList.add("active");

      var sidebar = document.getElementById("supportThreadsSidebar");
      var convo = document.getElementById("chatConvoArea");
      if (sidebar && convo) {
        sidebar.classList.add("hide-mobile");
        convo.classList.add("active-mobile");
      }

      subscribeToStudentChatRealtime(studentUid);
    }

    function closeThreadOnMobile() {
      var sidebar = document.getElementById("supportThreadsSidebar");
      var convo = document.getElementById("chatConvoArea");
      if (sidebar && convo) {
        sidebar.classList.remove("hide-mobile");
        convo.classList.remove("active-mobile");
      }
    }

    function filterThreadsList(query) {
      var q = (query || "").trim().toLowerCase();
      var filtered = cachedThreads.filter(function(t) {
        return (t.studentName && t.studentName.toLowerCase().includes(q)) || 
               (t.studentPhone && t.studentPhone.includes(q)) || 
               (t.lastMessage && t.lastMessage.toLowerCase().includes(q));
      });
      renderThreadsDom(filtered);
    }

    function renderThreadsDom(threads) {
      var container = document.getElementById("supportThreadsListContainer");
      if (!container) return;

      var user = getCurrentUser();
      var isStaff = user && (user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT");

      if (!threads || threads.length === 0) {
        container.innerHTML = '<div style="padding:20px; font-size:12.5px; color:#64748B; text-align:center;">لا توجد رسائل واردة حالياً.</div>';
        return;
      }

      container.innerHTML = threads.map(function(t) {
        var unreadBadge = (t.unreadCount && t.unreadCount > 0) 
          ? '<span style="background:#ef4444; color:#fff; font-size:10px; font-weight:900; padding:2px 6px; border-radius:10px;">' + t.unreadCount + '</span>' 
          : '';
        var isActive = currentSelectedStudentUid === t.studentUid ? "active" : "";
        var deleteIconHtml = isStaff 
          ? '<button type="button" class="btn-delete-thread" title="حذف المحادثة" onclick="event.stopPropagation(); deleteThreadByUid(\'' + t.studentUid + '\', \'' + sanitizeText(t.studentName) + '\')">🗑️</button>' 
          : '';

        return '<div id="threadRow_' + t.studentUid + '" class="thread-item-row ' + isActive + '" onclick="selectStudentThread(\'' + t.studentUid + '\', \'' + sanitizeText(t.studentName) + '\', \'' + sanitizeText(t.studentPhone) + '\')">' +
          '<div class="thread-info-box">' +
            '<div class="thread-name-title">' + sanitizeText(t.studentName) + '</div>' +
            '<div class="thread-preview-msg">' + sanitizeText(t.lastMessage || "بدء محادثة جديدة...") + '</div>' +
          '</div>' +
          '<div class="thread-actions-box">' +
            unreadBadge +
            deleteIconHtml +
          '</div>' +
        '</div>';
      }).join("");
    }

    // دالة حذف الشات وتطهيره بشكل كامل وشامل لدى الطالب والإدارة
    async function deleteThreadByUid(studentUid, studentName) {
      var confirmed = await customConfirm("هل أنت متأكد من مسح محادثة الطالب (" + studentName + ") بالكامل؟ سيتم تصفير الرسائل لدى الطالب والإدارة بشكل نهائي.", "مسح المحادثة", "مسح نهائي", "إلغاء");
      if (!confirmed) return;

      var currentTimestamp = new Date().toISOString();

      try {
        if (window.firebase && firebase.firestore) {
          var db = firebase.firestore();
          
          // 1. جلب وحذف جميع الرسائل السابقة للطالب
          var snap = await db.collection("support_messages").where("studentUid", "==", studentUid).get();
          if (!snap.empty) {
            var batches = [];
            var batch = db.batch();
            var count = 0;

            snap.docs.forEach(function(doc) {
              batch.delete(doc.ref);
              count++;
              if (count === 400) {
                batches.push(batch.commit());
                batch = db.batch();
                count = 0;
              }
            });
            if (count > 0) batches.push(batch.commit());
            await Promise.all(batches);
          }

          // 2. تحديث سجل المحادثة وتعيين clearedAt لمنع إحياء الرسائل السابقة
          await db.collection("support_threads").doc(studentUid).set({
            studentUid: studentUid,
            studentName: studentName,
            lastMessage: "تم مسح المحادثة السابقة",
            lastMessageTime: currentTimestamp,
            clearedAt: currentTimestamp,
            unreadCount: 0
          }, { merge: true });
        }

        // 3. تنظيف التخزين المحلي
        localStorage.removeItem("edu_chat_" + studentUid);

        // إفراغ الشاشة الحالية
        if (currentSelectedStudentUid === studentUid) {
          renderMessages([]);
        }

        showToast("تم مسح محادثة الطالب بنجاح ولن تعود الرسائل القديمة مجدداً", "success");
      } catch (err) {
        console.error("Delete Thread Error:", err);
        showToast("حدث خطأ أثناء محاولة مسح المحادثة", "error");
      }
    }

    async function deleteCurrentOpenChat() {
      if (!currentSelectedStudentUid) return;
      var targetName = document.getElementById("chatTargetNameDisplay").innerText;
      await deleteThreadByUid(currentSelectedStudentUid, targetName);
    }

    // إرسال الرسالة
    document.getElementById("chatSendMessageForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      var input = document.getElementById("chatMessageInput");
      var text = input.value.trim();
      if (!text) return;

      var user = getCurrentUser();
      if (!user) {
        showToast("يرجى تسجيل الدخول أولاً للمراسلة", "error");
        return;
      }

      var targetUid = currentSelectedStudentUid || user.uid;
      var nowTime = new Date().toISOString();

      var msgData = {
        studentUid: targetUid,
        senderUid: user.uid,
        senderName: user.fullName || "مستخدم",
        senderRole: user.role || "STUDENT",
        studentName: (currentSelectedStudentUid && user.role !== "STUDENT") ? document.getElementById("chatTargetNameDisplay").innerText : (user.fullName || "طالب"),
        studentPhone: user.studentPhone || user.phone || "",
        studentEmail: user.email || "",
        text: text,
        createdAt: nowTime
      };

      input.value = "";

      if (window.FirebaseService) {
        await window.FirebaseService.sendSupportMessage(msgData);
      } else {
        var key = "edu_chat_" + targetUid;
        var list = JSON.parse(localStorage.getItem(key)) || [];
        list.push(msgData);
        localStorage.setItem(key, JSON.stringify(list));
        renderMessages(list);
      }
    });

    document.addEventListener("DOMContentLoaded", function() {
      var user = getCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      var isStaff = user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT";
      var sidebar = document.getElementById("supportThreadsSidebar");

      if (isStaff) {
        if (sidebar) sidebar.style.display = "flex";
        
        var interval = setInterval(function() {
          if (window.FirebaseService && window.firebase && firebase.firestore) {
            clearInterval(interval);
            window.FirebaseService.subscribeAllSupportThreads(function(threads) {
              cachedThreads = threads || [];
              renderThreadsDom(cachedThreads);

              if (!currentSelectedStudentUid && cachedThreads[0]) {
                selectStudentThread(cachedThreads[0].studentUid, cachedThreads[0].studentName, cachedThreads[0].studentPhone);
              }
            });
          }
        }, 200);
      } else {
        currentSelectedStudentUid = user.uid;
        document.getElementById("chatTargetNameDisplay").innerText = "أ/ محمد السعيد والدعم الأكاديمي";
        document.getElementById("chatTargetSubDisplay").innerText = "متصل الآن للمساعدة";

        subscribeToStudentChatRealtime(user.uid);
      }
    });
  </script>
</body>
</html>
