<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شات الدعم والأسئلة - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #F0F4FC;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .support-chat-container {
      max-width: 1100px;
      width: 100%;
      margin: 75px auto 12px;
      padding: 0 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      box-sizing: border-box;
    }

    .support-chat-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(14, 19, 56, 0.08);
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .support-threads-sidebar {
      background: #F8FAFC;
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .threads-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: #ffffff;
      flex-shrink: 0;
    }

    .threads-header h3 {
      font-size: 15px;
      font-weight: 900;
      color: var(--royal-indigo-base);
      margin: 0 0 8px;
    }

    .threads-search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
      box-sizing: border-box;
    }

    .threads-search-input:focus {
      border-color: var(--cyan-accent);
    }

    .threads-list {
      flex: 1;
      overflow-y: auto;
    }

    .thread-item-row {
      padding: 12px 14px;
      border-bottom: 1px solid #EEF2F6;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .thread-item-row:hover, .thread-item-row.active {
      background: rgba(0, 210, 255, 0.08);
    }

    .thread-info-box {
      flex: 1;
      min-width: 0;
    }

    .thread-name-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--royal-indigo-base);
      margin-bottom: 3px;
    }

    .thread-preview-msg {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-actions-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-delete-thread {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 15px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-delete-thread:hover {
      background: #FEE2E2;
      color: #EF4444;
      transform: scale(1.1);
    }

    .chat-conversation-area {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: #ffffff;
      position: relative;
    }

    .chat-convo-header {
      padding: 12px 20px;
      background: var(--royal-indigo-base);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
      z-index: 2;
    }

    .chat-convo-header h3 {
      font-size: 14.5px;
      font-weight: 900;
      margin: 0 0 2px;
    }

    .chat-convo-header span {
      font-size: 11.5px;
      color: var(--cyan-accent);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chat-convo-header span::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #10B981;
      border-radius: 50%;
      display: inline-block;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear-chat-history {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear-chat-history:hover {
      background: #EF4444;
      color: #ffffff;
    }

    .chat-back-btn {
      display: none;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .messages-stream-box {
      flex: 1;
      min-height: 0;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at center, #FFFFFF 0%, #F8FAFC 100%);
      scroll-behavior: smooth;
    }

    .chat-bubble {
      max-width: 76%;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }

    .chat-bubble.student {
      align-self: flex-start;
      background: #F1F5F9;
      color: #0E1338;
      border-bottom-right-radius: 3px;
      border: 1px solid #E2E8F0;
    }

    .chat-bubble.staff {
      align-self: flex-end;
      background: linear-gradient(135deg, #0E1338 0%, #1D255E 100%);
      color: #ffffff;
      border-bottom-left-radius: 3px;
      box-shadow: 0 4px 12px rgba(14, 19, 56, 0.12);
    }

    .chat-bubble .bubble-sender {
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 3px;
      color: #0284C7;
    }

    .chat-bubble.staff .bubble-sender {
      color: #00D2FF;
    }

    .chat-bubble .bubble-time {
      display: block;
      font-size: 10px;
      opacity: 0.75;
      margin-top: 4px;
      text-align: left;
    }

    .chat-input-bar-form {
      padding: 12px 16px;
      border-top: 1px solid #EEF2F6;
      background: #ffffff;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      z-index: 2;
    }

    .chat-input-bar-form input {
      flex: 1;
      height: 44px;
      padding: 0 14px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      font-size: 13.5px;
      outline: none;
    }

    .chat-input-bar-form input:focus {
      border-color: var(--cyan-accent);
      background: #ffffff;
    }

    .chat-input-bar-form button {
      padding: 0 20px;
      height: 44px;
      background: var(--royal-indigo-base);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-input-bar-form button:hover {
      background: var(--royal-indigo-light);
    }

    .empty-select-chat-notice {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748B;
      text-align: center;
      padding: 20px;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .support-chat-container {
        margin-top: 65px;
        margin-bottom: 6px;
        padding: 0 8px;
      }

      .support-chat-card {
        grid-template-columns: 1fr;
        border-radius: 14px;
      }

      .support-threads-sidebar.hide-mobile {
        display: none !important;
      }

      .chat-conversation-area.active-mobile {
        display: flex !important;
        width: 100%;
        height: 100%;
      }

      .chat-back-btn {
        display: inline-flex;
      }
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox"></div>
    </nav>
  </div>

  <main class="support-chat-container">
    <div class="support-chat-card">
      
      <!-- القائمة الجانبية للإدارة -->
      <div class="support-threads-sidebar" id="supportThreadsSidebar" style="display:none;">
        <div class="threads-header">
          <h3>استفسارات الطلاب</h3>
          <input type="text" id="threadsSearchInput" class="threads-search-input" placeholder="بحث باسم الطالب أو الهاتف...">
        </div>
        <div class="threads-list" id="supportThreadsListContainer"></div>
      </div>

      <!-- نافذة المحادثة -->
      <div class="chat-conversation-area" id="chatConvoArea">
        <div class="chat-convo-header">
          <div>
            <h3 id="chatTargetNameDisplay">الدعم الفني والأكاديمي</h3>
            <span id="chatTargetSubDisplay">فريق الأستاذ محمد السعيد</span>
          </div>

          <div class="chat-header-actions">
            <button type="button" id="btnClearCurrentChat" class="btn-clear-chat-history" style="display:none;">مسح المحادثة</button>
            <button type="button" id="btnBackToThreadsList" class="chat-back-btn">المحادثات</button>
          </div>
        </div>

        <div class="messages-stream-box" id="messagesStreamBox"></div>

        <form class="chat-input-bar-form" id="chatSendMessageForm">
          <input type="text" id="chatMessageInput" placeholder="اكتب سؤالك أو استفسارك هنا..." required autocomplete="off">
          <button type="submit" id="chatSendBtn">
            <span>إرسال</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentSelectedStudentUid = null;
    var unsubscribeMessages = null;
    var cachedThreads = [];

    function getAppCurrentUser() {
      if (typeof window.getCurrentUser === "function") {
        return window.getCurrentUser();
      }
      try {
        var raw = localStorage.getItem("current_user") || localStorage.getItem("edu_currentUser");
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function formatChatTime(dateStr) {
      if (!dateStr) return "";
      var d = new Date(dateStr);
      return isNaN(d.getTime()) ? "" : d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
    }

    function toggleChatInputForm(show) {
      var form = document.getElementById("chatSendMessageForm");
      if (form) {
        form.style.display = show ? "flex" : "none";
      }
    }

    function scrollToBottom() {
      var box = document.getElementById("messagesStreamBox");
      if (box) {
        window.requestAnimationFrame(function() {
          box.scrollTop = box.scrollHeight;
        });
      }
    }

    function renderMessages(messages) {
      var box = document.getElementById("messagesStreamBox");
      if (!box) return;

      var currentUser = getAppCurrentUser();
      var myUid = currentUser ? String(currentUser.uid || currentUser.id || "") : "";
      var isStaff = currentUser && (currentUser.role === "SUPER_ADMIN" || currentUser.role === "ADMIN" || currentUser.role === "SUPPORT");

      if (isStaff && !currentSelectedStudentUid) {
        toggleChatInputForm(false);
        box.innerHTML = '<div class="empty-select-chat-notice"><div style="font-size:32px;">💬</div><strong>لا توجد محادثة مفتوحة حالياً</strong><span>اختر طالباً من القائمة الجانبية لبدء المحادثة</span></div>';
        return;
      }

      toggleChatInputForm(true);

      if (!messages || messages.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:#64748B; font-size:13px; margin:auto;">أهلاً بك! اكتب سؤالك هنا وسيقوم الفريق بالرد عليك فوراً.</div>';
        return;
      }

      var sanitize = typeof window.sanitizeText === "function" ? window.sanitizeText : function(str) { return str || ""; };

      box.innerHTML = messages.map(function(m) {
        var isMe = (myUid && String(m.senderUid) === myUid) || (currentUser && currentUser.email && m.senderEmail && m.senderEmail.toLowerCase() === currentUser.email.toLowerCase());
        var isSenderStaff = m.senderRole === "SUPER_ADMIN" || m.senderRole === "ADMIN" || m.senderRole === "SUPPORT";
        var bubbleClass = isMe ? "staff" : "student";
        var senderLabel = isMe ? "أنت" : sanitize(m.senderName || (isSenderStaff ? "فريق أ/ محمد السعيد" : "الطالب"));

        return '<div class="chat-bubble ' + bubbleClass + '">' +
          '<div class="bubble-sender">' + senderLabel + '</div>' +
          '<div>' + sanitize(m.text) + '</div>' +
          '<span class="bubble-time">' + formatChatTime(m.createdAt) + '</span>' +
        '</div>';
      }).join("");

      scrollToBottom();
    }

    function listenToChat(targetStudentUid) {
      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
      }

      var studentKey = String(targetStudentUid);

      if (window["FirebaseService"] && typeof window["FirebaseService"].subscribeStudentChat === "function") {
        unsubscribeMessages = window["FirebaseService"].subscribeStudentChat(studentKey, function(msgs) {
          renderMessages(msgs);
        });
      } else if (window["firebase"] && window["firebase"].firestore) {
        var db = window["firebase"].firestore();
        unsubscribeMessages = db.collection("support_messages")
          .where("studentUid", "==", studentKey)
          .onSnapshot(function(snap) {
            var list = [];
            snap.forEach(function(doc) {
              var data = doc.data();
              if (data) {
                data.id = doc.id;
                list.push(data);
              }
            });
            list.sort(function(a, b) {
              return new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime();
            });
            renderMessages(list);
          }, function() {
            var fallback = JSON.parse(localStorage.getItem("edu_chat_" + studentKey) || "[]");
            renderMessages(fallback);
          });
      } else {
        var localMsgs = JSON.parse(localStorage.getItem("edu_chat_" + studentKey) || "[]");
        renderMessages(localMsgs);
      }
    }

    function selectStudentThread(studentUid, studentName, studentPhone) {
      currentSelectedStudentUid = String(studentUid);
      var nameEl = document.getElementById("chatTargetNameDisplay");
      var subEl = document.getElementById("chatTargetSubDisplay");
      if (nameEl) nameEl.innerText = studentName;
      if (subEl) subEl.innerText = studentPhone || "طالب مسجل";

      var user = getAppCurrentUser();
      var isStaff = user && (user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT");
      var clearBtn = document.getElementById("btnClearCurrentChat");
      if (clearBtn) clearBtn.style.display = isStaff ? "inline-flex" : "none";

      document.querySelectorAll(".thread-item-row").forEach(function(el) { el.classList.remove("active"); });
      var activeEl = document.getElementById("threadRow_" + studentUid);
      if (activeEl) activeEl.classList.add("active");

      var sidebar = document.getElementById("supportThreadsSidebar");
      var convo = document.getElementById("chatConvoArea");
      if (sidebar && convo) {
        sidebar.classList.add("hide-mobile");
        convo.classList.add("active-mobile");
      }

      listenToChat(currentSelectedStudentUid);
    }

    function closeThreadOnMobile() {
      var sidebar = document.getElementById("supportThreadsSidebar");
      var convo = document.getElementById("chatConvoArea");
      if (sidebar && convo) {
        sidebar.classList.remove("hide-mobile");
        convo.classList.remove("active-mobile");
      }
    }

    function filterThreadsList(query) {
      var q = (query || "").trim().toLowerCase();
      var filtered = cachedThreads.filter(function(t) {
        return (t.studentName && t.studentName.toLowerCase().indexOf(q) !== -1) || 
               (t.studentPhone && t.studentPhone.indexOf(q) !== -1) || 
               (t.lastMessage && t.lastMessage.toLowerCase().indexOf(q) !== -1);
      });
      renderThreadsDom(filtered);
    }

    function renderThreadsDom(threads) {
      var container = document.getElementById("supportThreadsListContainer");
      if (!container) return;

      var user = getAppCurrentUser();
      var isStaff = user && (user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT");

      if (!threads || threads.length === 0) {
        container.innerHTML = '<div style="padding:20px; font-size:12.5px; color:#64748B; text-align:center;">لا توجد استفسارات حالياً.</div>';
        if (isStaff && !currentSelectedStudentUid) {
          renderMessages([]);
        }
        return;
      }

      var sanitize = typeof window.sanitizeText === "function" ? window.sanitizeText : function(str) { return str || ""; };

      container.innerHTML = threads.map(function(t) {
        var unreadBadge = (t.unreadCount && t.unreadCount > 0) 
          ? '<span style="background:#ef4444; color:#fff; font-size:10px; font-weight:900; padding:2px 6px; border-radius:10px;">' + t.unreadCount + '</span>' 
          : '';
        var isActive = currentSelectedStudentUid === String(t.studentUid) ? "active" : "";
        var deleteIconHtml = isStaff 
          ? '<button type="button" class="btn-delete-thread" data-uid="' + t.studentUid + '" data-name="' + sanitize(t.studentName) + '">🗑️</button>' 
          : '';

        return '<div id="threadRow_' + t.studentUid + '" class="thread-item-row ' + isActive + '" data-uid="' + t.studentUid + '" data-name="' + sanitize(t.studentName) + '" data-phone="' + sanitize(t.studentPhone) + '">' +
          '<div class="thread-info-box">' +
            '<div class="thread-name-title">' + sanitize(t.studentName) + '</div>' +
            '<div class="thread-preview-msg">' + sanitize(t.lastMessage || "بدء محادثة...") + '</div>' +
          '</div>' +
          '<div class="thread-actions-box">' +
            unreadBadge +
            deleteIconHtml +
          '</div>' +
        '</div>';
      }).join("");

      container.querySelectorAll(".thread-item-row").forEach(function(row) {
        row.addEventListener("click", function() {
          selectStudentThread(this.getAttribute("data-uid") || "", this.getAttribute("data-name") || "", this.getAttribute("data-phone") || "");
        });
      });

      container.querySelectorAll(".btn-delete-thread").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          deleteThreadByUid(this.getAttribute("data-uid") || "", this.getAttribute("data-name") || "");
        });
      });
    }

    function triggerCustomConfirm(msg, title) {
      if (typeof window.customConfirm === "function") {
        return window.customConfirm(msg, title, "مسح نهائي", "إلغاء");
      }
      return Promise.resolve(window.confirm(msg));
    }

    function triggerToast(msg, type) {
      if (typeof window.showToast === "function") {
        window.showToast(msg, type);
      } else {
        window.alert(msg);
      }
    }

    function deleteThreadByUid(studentUid, studentName) {
      var targetKey = String(studentUid);
      triggerCustomConfirm("هل أنت متأكد من مسح محادثة الطالب (" + studentName + ") بالكامل؟ سيتم مسح الرسائل لدى الطرفين.", "مسح المحادثة").then(function(confirmed) {
        if (!confirmed) return;

        var deletePromise = Promise.resolve();

        if (window["firebase"] && window["firebase"].firestore) {
          var db = window["firebase"].firestore();
          deletePromise = db.collection("support_messages").where("studentUid", "==", targetKey).get().then(function(snap) {
            if (!snap.empty) {
              var batch = db.batch();
              snap.docs.forEach(function(doc) {
                batch.delete(doc.ref);
              });
              return batch.commit();
            }
          }).then(function() {
            return db.collection("support_threads").doc(targetKey).delete();
          });
        }

        deletePromise.then(function() {
          localStorage.removeItem("edu_chat_" + targetKey);

          if (currentSelectedStudentUid === targetKey) {
            currentSelectedStudentUid = null;
            var nameEl = document.getElementById("chatTargetNameDisplay");
            var subEl = document.getElementById("chatTargetSubDisplay");
            if (nameEl) nameEl.innerText = "الدعم الفني والأكاديمي";
            if (subEl) subEl.innerText = "فريق الأستاذ محمد السعيد";
            var clearBtn = document.getElementById("btnClearCurrentChat");
            if (clearBtn) clearBtn.style.display = "none";
            renderMessages([]);
          }

          triggerToast("تم مسح محادثة الطالب بنجاح", "success");
        }).catch(function(err) {
          console.error("Delete Error:", err);
          triggerToast("حدث خطأ أثناء محاولة مسح المحادثة", "error");
        });
      });
    }

    function deleteCurrentOpenChat() {
      if (!currentSelectedStudentUid) return;
      var nameEl = document.getElementById("chatTargetNameDisplay");
      var targetName = nameEl ? nameEl.innerText : "الطالب";
      deleteThreadByUid(currentSelectedStudentUid, targetName);
    }

    document.addEventListener("DOMContentLoaded", function() {
      var user = getAppCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      var isStaff = user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT";
      var sidebar = document.getElementById("supportThreadsSidebar");

      var searchInput = document.getElementById("threadsSearchInput");
      if (searchInput) {
        searchInput.addEventListener("input", function() {
          filterThreadsList(this.value);
        });
      }

      var clearChatBtn = document.getElementById("btnClearCurrentChat");
      if (clearChatBtn) {
        clearChatBtn.addEventListener("click", deleteCurrentOpenChat);
      }

      var backBtn = document.getElementById("btnBackToThreadsList");
      if (backBtn) {
        backBtn.addEventListener("click", closeThreadOnMobile);
      }

      var chatForm = document.getElementById("chatSendMessageForm");
      if (chatForm) {
        chatForm.addEventListener("submit", function(e) {
          e.preventDefault();
          var input = document.getElementById("chatMessageInput");
          var text = input ? input.value.trim() : "";
          if (!text) return;

          var currentUserData = getAppCurrentUser();
          if (!currentUserData) {
            triggerToast("يرجى تسجيل الدخول أولاً للمراسلة", "error");
            return;
          }

          var userUid = String(currentUserData.uid || currentUserData.id || "");
          var targetUid = currentSelectedStudentUid ? String(currentSelectedStudentUid) : userUid;
          var nowTime = new Date().toISOString();

          var nameDisplay = document.getElementById("chatTargetNameDisplay");

          var msgData = {
            studentUid: targetUid,
            senderUid: userUid,
            senderName: currentUserData.fullName || "مستخدم",
            senderRole: currentUserData.role || "STUDENT",
            studentName: (currentSelectedStudentUid && currentUserData.role !== "STUDENT") ? (nameDisplay ? nameDisplay.innerText : "طالب") : (currentUserData.fullName || "طالب"),
            studentPhone: currentUserData.studentPhone || currentUserData.phone || "",
            studentEmail: currentUserData.email || "",
            text: text,
            createdAt: nowTime
          };

          if (input) input.value = "";

          if (window["FirebaseService"] && typeof window["FirebaseService"].sendSupportMessage === "function") {
            window["FirebaseService"].sendSupportMessage(msgData).then(function() {
              scrollToBottom();
            });
          } else if (window["firebase"] && window["firebase"].firestore) {
            var db = window["firebase"].firestore();
            db.collection("support_messages").add(msgData).then(function() {
              return db.collection("support_threads").doc(targetUid).set({
                studentUid: targetUid,
                studentName: msgData.studentName,
                studentPhone: msgData.studentPhone,
                lastMessage: text,
                lastMessageTime: nowTime,
                updatedAt: nowTime,
                unreadCount: (currentUserData.role === "STUDENT") ? window["firebase"].firestore.FieldValue.increment(1) : 0
              }, { merge: true });
            }).then(function() {
              scrollToBottom();
            }).catch(function(err) {
              console.error("Send Error:", err);
            });
          } else {
            var localKey = "edu_chat_" + targetUid;
            var localMsgs = JSON.parse(localStorage.getItem(localKey) || "[]");
            localMsgs.push(msgData);
            localStorage.setItem(localKey, JSON.stringify(localMsgs));
            renderMessages(localMsgs);
            scrollToBottom();
          }
        });
      }

      if (isStaff) {
        if (sidebar) sidebar.style.display = "flex";
        toggleChatInputForm(false);
        renderMessages([]);

        var checkThreadsInterval = window.setInterval(function() {
          if (window["FirebaseService"] && typeof window["FirebaseService"].subscribeAllSupportThreads === "function") {
            window.clearInterval(checkThreadsInterval);
            window["FirebaseService"].subscribeAllSupportThreads(function(threads) {
              cachedThreads = threads || [];
              renderThreadsDom(cachedThreads);

              if (!currentSelectedStudentUid && cachedThreads.length > 0) {
                selectStudentThread(cachedThreads[0].studentUid, cachedThreads[0].studentName, cachedThreads[0].studentPhone);
              } else if (cachedThreads.length === 0) {
                currentSelectedStudentUid = null;
                renderMessages([]);
              }
            });
          } else if (window["firebase"] && window["firebase"].firestore) {
            window.clearInterval(checkThreadsInterval);
            window["firebase"].firestore().collection("support_threads").onSnapshot(function(snap) {
              cachedThreads = [];
              snap.forEach(function(doc) {
                var d = doc.data();
                if (d && d.studentUid) {
                  d.id = doc.id;
                  cachedThreads.push(d);
                }
              });
              cachedThreads.sort(function(a, b) {
                return new Date(b.lastMessageTime || 0).getTime() - new Date(a.lastMessageTime || 0).getTime();
              });
              renderThreadsDom(cachedThreads);

              if (!currentSelectedStudentUid && cachedThreads.length > 0) {
                selectStudentThread(cachedThreads[0].studentUid, cachedThreads[0].studentName, cachedThreads[0].studentPhone);
              } else if (cachedThreads.length === 0) {
                currentSelectedStudentUid = null;
                renderMessages([]);
              }
            });
          }
        }, 150);
      } else {
        var userUid = String(user.uid || user.id || "");
        currentSelectedStudentUid = userUid;
        var nameDisplayEl = document.getElementById("chatTargetNameDisplay");
        var subDisplayEl = document.getElementById("chatTargetSubDisplay");
        if (nameDisplayEl) nameDisplayEl.innerText = "أ/ محمد السعيد والدعم الأكاديمي";
        if (subDisplayEl) subDisplayEl.innerText = "متصل الآن للمساعدة";

        toggleChatInputForm(true);

        var checkChatInterval = window.setInterval(function() {
          if (window["FirebaseService"] || (window["firebase"] && window["firebase"].firestore)) {
            window.clearInterval(checkChatInterval);
            listenToChat(userUid);
          }
        }, 150);
      }
    });
  </script>
</body>
</html>
