<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شات الدعم والأسئلة - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #F0F4FC;
    }

    .support-chat-container {
      max-width: 1140px;
      width: 100%;
      height: calc(100vh - 85px);
      margin: 75px auto 10px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .support-chat-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(14, 19, 56, 0.08);
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .support-threads-sidebar {
      background: #F8FAFC;
      border-left: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .threads-header {
      padding: 14px 16px;
      border-bottom: 1px solid #E2E8F0;
      background: #ffffff;
      flex-shrink: 0;
    }

    .threads-header h3 {
      font-size: 15px;
      font-weight: 900;
      color: var(--royal-indigo-base);
      margin: 0 0 8px;
    }

    .threads-search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #E2E8F0;
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
      box-sizing: border-box;
    }

    .threads-search-input:focus {
      border-color: var(--cyan-accent);
    }

    .threads-list {
      flex: 1;
      overflow-y: auto;
    }

    .thread-item-row {
      padding: 12px 14px;
      border-bottom: 1px solid #EEF2F6;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .thread-item-row:hover, .thread-item-row.active {
      background: rgba(0, 210, 255, 0.08);
    }

    .thread-info-box {
      flex: 1;
      min-width: 0;
    }

    .thread-name-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--royal-indigo-base);
      margin-bottom: 3px;
    }

    .thread-preview-msg {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-actions-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-delete-thread {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 15px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-delete-thread:hover {
      background: #FEE2E2;
      color: #EF4444;
      transform: scale(1.1);
    }

    .chat-conversation-area {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: #ffffff;
      position: relative;
    }

    .chat-convo-header {
      padding: 12px 20px;
      background: var(--royal-indigo-base);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
      height: 60px;
      box-sizing: border-box;
      z-index: 2;
    }

    .chat-convo-header h3 {
      font-size: 14.5px;
      font-weight: 900;
      margin: 0 0 2px;
    }

    .chat-convo-header span {
      font-size: 11.5px;
      color: var(--cyan-accent);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chat-convo-header span::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #10B981;
      border-radius: 50%;
      display: inline-block;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear-chat-history {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear-chat-history:hover {
      background: #EF4444;
      color: #ffffff;
    }

    .chat-back-btn {
      display: none;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .messages-stream-box {
      flex: 1;
      min-height: 0;
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at center, #FFFFFF 0%, #F8FAFC 100%);
      scroll-behavior: smooth;
    }

    .chat-bubble {
      max-width: 76%;
      width: fit-content;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }

    .chat-bubble.student {
      align-self: flex-start;
      background: #F1F5F9;
      color: #0E1338;
      border-bottom-right-radius: 3px;
      border: 1px solid #E2E8F0;
    }

    .chat-bubble.staff {
      align-self: flex-end;
      background: linear-gradient(135deg, #0E1338 0%, #1D255E 100%);
      color: #ffffff;
      border-bottom-left-radius: 3px;
      box-shadow: 0 4px 12px rgba(14, 19, 56, 0.12);
    }

    .chat-bubble .bubble-sender {
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 3px;
      color: #0284C7;
    }

    .chat-bubble.staff .bubble-sender {
      color: #00D2FF;
    }

    .chat-bubble .bubble-time {
      display: block;
      font-size: 10px;
      opacity: 0.75;
      margin-top: 4px;
      text-align: left;
    }

    .chat-input-bar-form {
      padding: 12px 16px;
      border-top: 1px solid #EEF2F6;
      background: #ffffff;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      height: 68px;
      box-sizing: border-box;
      z-index: 2;
    }

    .chat-input-bar-form input {
      flex: 1;
      height: 44px;
      padding: 0 14px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      font-size: 13.5px;
      outline: none;
      box-sizing: border-box;
    }

    .chat-input-bar-form input:focus {
      border-color: var(--cyan-accent);
      background: #ffffff;
    }

    .chat-input-bar-form button {
      padding: 0 22px;
      height: 44px;
      background: var(--royal-indigo-base);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .chat-input-bar-form button:hover {
      background: var(--royal-indigo-light);
    }

    .empty-select-chat-notice {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748B;
      text-align: center;
      padding: 20px;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .support-chat-container {
        height: calc(100vh - 75px);
        margin-top: 65px;
        margin-bottom: 6px;
        padding: 0 8px;
      }

      .support-chat-card {
        grid-template-columns: 1fr;
        border-radius: 14px;
      }

      .support-threads-sidebar.hide-mobile {
        display: none !important;
      }

      .chat-conversation-area.active-mobile {
        display: flex !important;
        width: 100%;
        height: 100%;
      }

      .chat-back-btn {
        display: inline-flex;
      }
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox"></div>
    </nav>
  </div>

  <main class="support-chat-container">
    <div class="support-chat-card">
      
      <!-- القائمة الجانبية للإدارة -->
      <div class="support-threads-sidebar" id="supportThreadsSidebar" style="display:none;">
        <div class="threads-header">
          <h3>استفسارات الطلاب</h3>
          <input type="text" id="threadsSearchInput" class="threads-search-input" placeholder="بحث باسم الطالب أو الهاتف...">
        </div>
        <div class="threads-list" id="supportThreadsListContainer"></div>
      </div>

      <!-- نافذة المحادثة -->
      <div class="chat-conversation-area" id="chatConvoArea">
        <div class="chat-convo-header">
          <div>
            <h3 id="chatTargetNameDisplay">الدعم الفني والأكاديمي</h3>
            <span id="chatTargetSubDisplay">فريق الأستاذ محمد السعيد</span>
          </div>

          <div class="chat-header-actions">
            <button type="button" id="btnClearCurrentChat" class="btn-clear-chat-history" style="display:none;">مسح المحادثة</button>
            <button type="button" id="btnBackToThreadsList" class="chat-back-btn">المحادثات</button>
          </div>
        </div>

        <div class="messages-stream-box" id="messagesStreamBox"></div>

        <form class="chat-input-bar-form" id="chatSendMessageForm">
          <input type="text" id="chatMessageInput" placeholder="اكتب سؤالك أو استفسارك هنا..." required autocomplete="off">
          <button type="submit" id="chatSendBtn">
            <span>إرسال</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentSelectedStudentUid = null;
    var unsubscribeChat = null;
    var cachedThreads = [];

    function getAppUser() {
      if (typeof window.getCurrentUser === "function") {
        return window.getCurrentUser();
      }
      try {
        var raw = localStorage.getItem("current_user") || localStorage.getItem("edu_currentUser");
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function formatTime(str) {
      if (!str) return "";
      var d = new Date(str);
      return isNaN(d.getTime()) ? "" : d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
    }

    function scrollToBottom() {
      var box = document.getElementById("messagesStreamBox");
      if (box) {
        window.requestAnimationFrame(function() {
          box.scrollTop = box.scrollHeight;
        });
      }
    }

    function renderChatMessages(list) {
      var box = document.getElementById("messagesStreamBox");
      if (!box) return;

      var user = getAppUser();
      var myUid = user ? String(user.uid || user.id || "") : "";
      var isStaff = user && (user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT");
      var form = document.getElementById("chatSendMessageForm");

      if (isStaff && !currentSelectedStudentUid) {
        if (form) form.style.display = "none";
        box.innerHTML = '<div class="empty-select-chat-notice"><div style="font-size:32px;">💬</div><strong>لا توجد محادثة مفتوحة حالياً</strong><span>اختر طالباً من القائمة الجانبية لبدء المحادثة</span></div>';
        return;
      }

      if (form) form.style.display = "flex";

      if (!list || list.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:#64748B; font-size:13px; margin:auto;">أهلاً بك! اكتب استفسارك وسيقوم الفريق بالرد فوراً. 🧪</div>';
        return;
      }

      var sanitize = typeof window.sanitizeText === "function" ? window.sanitizeText : function(s) { return s || ""; };

      box.innerHTML = list.map(function(m) {
        var isMe = (myUid && String(m.senderUid) === myUid) || (user && user.email && m.senderEmail && m.senderEmail.toLowerCase() === user.email.toLowerCase());
        var isStaffSender = m.senderRole === "SUPER_ADMIN" || m.senderRole === "ADMIN" || m.senderRole === "SUPPORT";
        var bubbleClass = isMe ? "staff" : "student";
        var senderLabel = isMe ? "أنت" : sanitize(m.senderName || (isStaffSender ? "فريق أ/ محمد السعيد" : "الطالب"));

        return '<div class="chat-bubble ' + bubbleClass + '">' +
          '<div class="bubble-sender">' + senderLabel + '</div>' +
          '<div>' + sanitize(m.text) + '</div>' +
          '<span class="bubble-time">' + formatTime(m.createdAt) + '</span>' +
        '</div>';
      }).join("");

      scrollToBottom();
    }

    function startChatStream(studentUid) {
      if (unsubscribeChat) {
        unsubscribeChat();
        unsubscribeChat = null;
      }

      var key = String(studentUid);
      var localList = JSON.parse(localStorage.getItem("edu_chat_" + key) || "[]");
      renderChatMessages(localList);

      if (window.FirebaseService && typeof window.FirebaseService.subscribeStudentChat === "function") {
        unsubscribeChat = window.FirebaseService.subscribeStudentChat(key, function(msgs) {
          renderChatMessages(msgs);
        });
      }
    }

    function selectThread(studentUid, name, phone) {
      currentSelectedStudentUid = String(studentUid);
      var nameEl = document.getElementById("chatTargetNameDisplay");
      var subEl = document.getElementById("chatTargetSubDisplay");
      if (nameEl) nameEl.innerText = name;
      if (subEl) subEl.innerText = phone || "طالب مسجل";

      var user = getAppUser();
      var isStaff = user && (user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT");
      var clearBtn = document.getElementById("btnClearCurrentChat");
      if (clearBtn) clearBtn.style.display = isStaff ? "inline-flex" : "none";

      document.querySelectorAll(".thread-item-row").forEach(function(el) { el.classList.remove("active"); });
      var activeEl = document.getElementById("threadRow_" + studentUid);
      if (activeEl) activeEl.classList.add("active");

      var sidebar = document.getElementById("supportThreadsSidebar");
      var convo = document.getElementById("chatConvoArea");
      if (sidebar && convo) {
        sidebar.classList.add("hide-mobile");
        convo.classList.add("active-mobile");
      }

      startChatStream(currentSelectedStudentUid);
    }

    function renderThreadsListDom(list) {
      var container = document.getElementById("supportThreadsListContainer");
      if (!container) return;

      var user = getAppUser();
      var isStaff = user && (user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT");

      if (!list || list.length === 0) {
        container.innerHTML = '<div style="padding:20px; font-size:12.5px; color:#64748B; text-align:center;">لا توجد استفسارات حالياً.</div>';
        if (isStaff && !currentSelectedStudentUid) {
          renderChatMessages([]);
        }
        return;
      }

      var sanitize = typeof window.sanitizeText === "function" ? window.sanitizeText : function(s) { return s || ""; };

      container.innerHTML = list.map(function(t) {
        var unreadBadge = (t.unreadCount && t.unreadCount > 0) 
          ? '<span style="background:#ef4444; color:#fff; font-size:10px; font-weight:900; padding:2px 6px; border-radius:10px;">' + t.unreadCount + '</span>' 
          : '';
        var isActive = currentSelectedStudentUid === String(t.studentUid) ? "active" : "";
        var deleteIcon = isStaff 
          ? '<button type="button" class="btn-delete-thread" data-uid="' + t.studentUid + '" data-name="' + sanitize(t.studentName) + '">🗑️</button>' 
          : '';

        return '<div id="threadRow_' + t.studentUid + '" class="thread-item-row ' + isActive + '" data-uid="' + t.studentUid + '" data-name="' + sanitize(t.studentName) + '" data-phone="' + sanitize(t.studentPhone) + '">' +
          '<div class="thread-info-box">' +
            '<div class="thread-name-title">' + sanitize(t.studentName) + '</div>' +
            '<div class="thread-preview-msg">' + sanitize(t.lastMessage || "بدء محادثة...") + '</div>' +
          '</div>' +
          '<div class="thread-actions-box">' +
            unreadBadge +
            deleteIcon +
          '</div>' +
        '</div>';
      }).join("");

      container.querySelectorAll(".thread-item-row").forEach(function(row) {
        row.addEventListener("click", function() {
          selectThread(this.getAttribute("data-uid") || "", this.getAttribute("data-name") || "", this.getAttribute("data-phone") || "");
        });
      });

      container.querySelectorAll(".btn-delete-thread").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          deleteThread(this.getAttribute("data-uid") || "", this.getAttribute("data-name") || "");
        });
      });
    }

    function deleteThread(studentUid, name) {
      var key = String(studentUid);
      var confirmFn = typeof window.customConfirm === "function" ? window.customConfirm : function(m) { return Promise.resolve(window.confirm(m)); };

      confirmFn("هل أنت متأكد من مسح محادثة الطالب (" + name + ") بالكامل؟ سيتم مسحها لدى الطرفين.", "مسح المحادثة").then(function(ok) {
        if (!ok) return;

        if (window.FirebaseService && typeof window.FirebaseService.deleteSupportThread === "function") {
          window.FirebaseService.deleteSupportThread(key, name);
        } else {
          localStorage.removeItem("edu_chat_" + key);
        }

        if (currentSelectedStudentUid === key) {
          currentSelectedStudentUid = null;
          var nameEl = document.getElementById("chatTargetNameDisplay");
          var subEl = document.getElementById("chatTargetSubDisplay");
          if (nameEl) nameEl.innerText = "الدعم الفني والأكاديمي";
          if (subEl) subEl.innerText = "فريق الأستاذ محمد السعيد";
          var clearBtn = document.getElementById("btnClearCurrentChat");
          if (clearBtn) clearBtn.style.display = "none";
          renderChatMessages([]);
        }

        if (typeof window.showToast === "function") window.showToast("تم مسح المحادثة بنجاح", "success");
      });
    }

    document.addEventListener("DOMContentLoaded", function() {
      var user = getAppUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      var isStaff = user.role === "SUPER_ADMIN" || user.role === "ADMIN" || user.role === "SUPPORT";
      var sidebar = document.getElementById("supportThreadsSidebar");

      var searchInput = document.getElementById("threadsSearchInput");
      if (searchInput) {
        searchInput.addEventListener("input", function() {
          var q = (this.value || "").trim().toLowerCase();
          var filtered = cachedThreads.filter(function(t) {
            return (t.studentName && t.studentName.toLowerCase().indexOf(q) !== -1) || 
                   (t.studentPhone && t.studentPhone.indexOf(q) !== -1) || 
                   (t.lastMessage && t.lastMessage.toLowerCase().indexOf(q) !== -1);
          });
          renderThreadsListDom(filtered);
        });
      }

      var clearChatBtn = document.getElementById("btnClearCurrentChat");
      if (clearChatBtn) {
        clearChatBtn.addEventListener("click", function() {
          if (!currentSelectedStudentUid) return;
          var nameEl = document.getElementById("chatTargetNameDisplay");
          deleteThread(currentSelectedStudentUid, nameEl ? nameEl.innerText : "الطالب");
        });
      }

      var backBtn = document.getElementById("btnBackToThreadsList");
      if (backBtn) {
        backBtn.addEventListener("click", function() {
          if (sidebar) sidebar.classList.remove("hide-mobile");
          var convo = document.getElementById("chatConvoArea");
          if (convo) convo.classList.remove("active-mobile");
        });
      }

      var chatForm = document.getElementById("chatSendMessageForm");
      if (chatForm) {
        chatForm.addEventListener("submit", function(e) {
          e.preventDefault();
          var input = document.getElementById("chatMessageInput");
          var text = input ? input.value.trim() : "";
          if (!text) return;

          var currentUser = getAppUser();
          var userUid = String(currentUser.uid || currentUser.id || "");
          var targetUid = currentSelectedStudentUid ? String(currentSelectedStudentUid) : userUid;
          var now = new Date().toISOString();
          var nameDisplay = document.getElementById("chatTargetNameDisplay");

          var msg = {
            id: "m_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
            studentUid: targetUid,
            senderUid: userUid,
            senderName: currentUser.fullName || "مستخدم",
            senderRole: currentUser.role || "STUDENT",
            studentName: (currentSelectedStudentUid && currentUser.role !== "STUDENT") ? (nameDisplay ? nameDisplay.innerText : "طالب") : (currentUser.fullName || "طالب"),
            studentPhone: currentUser.studentPhone || currentUser.phone || "",
            studentEmail: currentUser.email || "",
            text: text,
            createdAt: now
          };

          if (input) input.value = "";

          if (window.FirebaseService && typeof window.FirebaseService.sendSupportMessage === "function") {
            window.FirebaseService.sendSupportMessage(msg).then(function() {
              scrollToBottom();
            });
          }
        });
      }

      if (isStaff) {
        if (sidebar) sidebar.style.display = "flex";
        renderChatMessages([]);

        var timer = setInterval(function() {
          if (window.FirebaseService && typeof window.FirebaseService.subscribeAllSupportThreads === "function") {
            clearInterval(timer);
            window.FirebaseService.subscribeAllSupportThreads(function(threads) {
              cachedThreads = threads || [];
              renderThreadsListDom(cachedThreads);

              if (!currentSelectedStudentUid && cachedThreads.length > 0) {
                selectThread(cachedThreads[0].studentUid, cachedThreads[0].studentName, cachedThreads[0].studentPhone);
              }
            });
          }
        }, 150);
      } else {
        var userUid = String(user.uid || user.id || "");
        currentSelectedStudentUid = userUid;
        var nameDisplayEl = document.getElementById("chatTargetNameDisplay");
        var subDisplayEl = document.getElementById("chatTargetSubDisplay");
        if (nameDisplayEl) nameDisplayEl.innerText = "أ/ محمد السعيد والدعم الأكاديمي";
        if (subDisplayEl) subDisplayEl.innerText = "متصل الآن للمساعدة";

        var timerStudent = setInterval(function() {
          if (window.FirebaseService && typeof window.FirebaseService.subscribeStudentChat === "function") {
            clearInterval(timerStudent);
            startChatStream(userUid);
          }
        }, 150);
      }
    });
  </script>
</body>
</html>
