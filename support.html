<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>مركز الدعم الفني - هي كيميا !</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .support-page-wrapper {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 75px 16px 16px;
      max-width: 1100px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .support-thread-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 16px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      min-height: 0; /* منع الـ Grid من التمدد خارج الشاشة */
    }
    .threads-sidebar {
      background: #F8FAFC;
      border-left: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .thread-item {
      padding: 12px 14px;
      border-bottom: 1px solid #E2E8F0;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .thread-item:hover, .thread-item.active { background: #EDF2F7; }
    .thread-item.active { border-right: 3px solid var(--cyan-accent); }
    
    .chat-view-pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      position: relative;
    }
    .chat-view-header {
      background: var(--royal-indigo-base);
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .chat-messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #FAFBFD;
      min-height: 0;
    }
    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.5;
      word-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-bubble.mine {
      align-self: flex-start;
      background: var(--royal-indigo-base);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .msg-bubble.other {
      align-self: flex-end;
      background: #E2E8F0;
      color: #0F172A;
      border-bottom-left-radius: 2px;
    }
    .msg-time {
      font-size: 10px;
      opacity: 0.75;
      margin-top: 4px;
      display: block;
      text-align: left;
    }

    /* شريط كتابة الرسائل المتجاوب والثابت */
    .chat-input-bar-container {
      padding: 12px 16px;
      background: #ffffff;
      border-top: 1px solid #E2E8F0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 20;
    }
    .chat-textarea-input {
      flex: 1;
      min-height: 42px;
      max-height: 110px;
      resize: none;
      padding: 10px 14px;
      font-size: 13.5px;
      line-height: 1.4;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      background: #F8FAFC;
      color: var(--text-dark);
      outline: none;
      overflow-y: auto;
      font-family: inherit;
    }
    .chat-textarea-input:focus {
      border-color: var(--cyan-accent);
      background: #ffffff;
    }
    .chat-send-btn {
      height: 42px;
      padding: 0 20px;
      background: var(--royal-indigo-base);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 860px) {
      .support-page-wrapper { padding: 65px 8px 8px; }
      .support-thread-layout { grid-template-columns: 1fr; }
      .threads-sidebar { display: none; }
      .threads-sidebar.show-mobile-threads { display: flex; position: absolute; inset: 0; z-index: 50; }
    }
  </style>
</head>
<body>

  <div class="navbar-capsule-wrapper">
    <nav class="navbar-capsule">
      <a href="index.html" class="capsule-brand">
        <div class="capsule-logo">HK</div>
        <span class="brand-text">هي كيميا<span>!</span></span>
      </a>
      <div class="capsule-auth" id="navAuthBox"></div>
    </nav>
  </div>

  <div class="support-page-wrapper">
    <div class="support-thread-layout">
      
      <!-- قائمة محادثات الطلاب للأدمن -->
      <aside class="threads-sidebar" id="adminThreadsSidebar" style="display:none;">
        <div style="padding:12px 14px; border-bottom:1px solid #E2E8F0; background:#fff;">
          <h3 style="font-size:13.5px; font-weight:800; color:var(--royal-indigo-base); margin:0;">محادثات الطلاب المنفصلة</h3>
        </div>
        <div id="threadsListContainer" style="overflow-y:auto; flex:1;"></div>
      </aside>

      <!-- منطقة الشات -->
      <main class="chat-view-pane">
        <div class="chat-view-header">
          <div>
            <h2 style="font-size:14.5px; font-weight:800; margin:0;" id="chatTargetNameDisplay">الدعم الفني</h2>
            <span style="font-size:11px; color:#00D2FF;" id="chatTargetSubDisplay">فريق الأستاذ محمد السعيد</span>
          </div>
          <a href="dashboard.html" class="nav-btn-link" style="color:#fff; background:rgba(255,255,255,0.12);">الرجوع</a>
        </div>

        <div class="chat-messages-area" id="supportChatMessagesArea">
          <div style="text-align:center; color:var(--text-muted); font-size:13px; margin:auto;">جاري تحميل المحادثة...</div>
        </div>

        <form class="chat-input-bar-container" id="sendSupportMsgForm">
          <textarea id="supportTextInput" class="chat-textarea-input" placeholder="اكتب استفسارك هنا..." rows="1" required></textarea>
          <button type="submit" class="chat-send-btn">إرسال</button>
        </form>
      </main>

    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script>
    var currentUser = null;
    var activeStudentEmail = null;
    var activeStudentName = null;

    // تمدد حقل الإدخال تلقائياً حتى حد أقصى
    var textarea = document.getElementById("supportTextInput");
    textarea.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (Math.min(this.scrollHeight, 110)) + "px";
    });

    textarea.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("sendSupportMsgForm").dispatchEvent(new Event("submit"));
      }
    });

    function selectStudentThread(studentEmail, studentName) {
      activeStudentEmail = studentEmail.toLowerCase().trim();
      activeStudentName = studentName;
      document.getElementById("chatTargetNameDisplay").innerText = studentName;
      document.getElementById("chatTargetSubDisplay").innerText = studentEmail;

      document.querySelectorAll(".thread-item").forEach(el => {
        el.classList.toggle("active", el.getAttribute("data-email") === activeStudentEmail);
      });

      if (window.FirebaseService) {
        window.FirebaseService.subscribeStudentChat(activeStudentEmail, renderMessages);
      }
    }

    function renderMessages(messages) {
      var container = document.getElementById("supportChatMessagesArea");
      if (!container) return;

      if (!messages || messages.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13px; margin:auto;">لا توجد رسائل سابقة. تفضل بكتابة رسالتك وسنرد فوراً.</div>';
        return;
      }

      container.innerHTML = messages.map(m => {
        var isMine = currentUser && (m.senderEmail.toLowerCase().trim() === currentUser.email.toLowerCase().trim());
        var timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString("ar-EG", { hour: '2-digit', minute: '2-digit' }) : "";
        return '<div class="msg-bubble ' + (isMine ? 'mine' : 'other') + '">' +
          '<div>' + sanitizeText(m.text) + '</div>' +
          '<span class="msg-time">' + timeStr + '</span>' +
        '</div>';
      }).join("");

      container.scrollTop = container.scrollHeight;
    }

    document.addEventListener("DOMContentLoaded", function() {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = "login.html?redirect=support.html";
        return;
      }

      var isStaff = currentUser.role === "SUPER_ADMIN" || currentUser.role === "ADMIN" || currentUser.role === "SUPPORT";

      if (isStaff) {
        var sidebar = document.getElementById("adminThreadsSidebar");
        if (sidebar) sidebar.style.display = "flex";

        var interval = setInterval(function() {
          if (window.FirebaseService && window.firebase && firebase.firestore) {
            clearInterval(interval);
            window.FirebaseService.subscribeAllSupportThreads(threads => {
              var container = document.getElementById("threadsListContainer");
              if (!container) return;

              if (threads.length === 0) {
                container.innerHTML = '<div style="padding:15px; font-size:12px; color:#64748B; text-align:center;">لا توجد محادثات طلاب حالياً.</div>';
                return;
              }

              container.innerHTML = threads.map(t => {
                var isSelected = activeStudentEmail === t.studentEmail;
                return '<div class="thread-item ' + (isSelected ? 'active' : '') + '" data-email="' + t.studentEmail + '" onclick="selectStudentThread(\'' + t.studentEmail + '\', \'' + (t.studentName || t.studentEmail).replace(/'/g, "\\'") + '\')">' +
                  '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">' +
                    '<strong style="font-size:13px; color:var(--royal-indigo-base);">' + (t.studentName || t.studentEmail) + '</strong>' +
                    (t.unreadCount > 0 ? '<span style="background:#ef4444; color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:10px;">' + t.unreadCount + '</span>' : '') +
                  '</div>' +
                  '<p style="font-size:11.5px; color:#64748B; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:0;">' + (t.lastMessage || "") + '</p>' +
                '</div>';
              }).join("");

              if (!activeStudentEmail && threads[0]) {
                selectStudentThread(threads[0].studentEmail, threads[0].studentName || threads[0].studentEmail);
              }
            });
          }
        }, 250);

      } else {
        activeStudentEmail = currentUser.email.toLowerCase().trim();
        activeStudentName = currentUser.fullName;

        var intervalStudent = setInterval(function() {
          if (window.FirebaseService && window.firebase && firebase.firestore) {
            clearInterval(intervalStudent);
            window.FirebaseService.subscribeStudentChat(activeStudentEmail, renderMessages);
          }
        }, 250);
      }

      document.getElementById("sendSupportMsgForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        var text = textarea.value.trim();
        if (!text || !activeStudentEmail) return;

        textarea.value = "";
        textarea.style.height = "42px";

        try {
          await window.FirebaseService.sendSupportMessage({
            studentEmail: activeStudentEmail,
            studentName: activeStudentName || activeStudentEmail,
            text: text,
            senderEmail: currentUser.email.toLowerCase().trim(),
            senderName: currentUser.fullName,
            senderRole: currentUser.role || "STUDENT"
          });
        } catch (err) {
          showToast("تعذر إرسال الرسالة: " + err.message, "error");
        }
      });
    });
  </script>
</body>
</html>
